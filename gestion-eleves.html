<script>
/* Correctif synchronisation : notes, codes professeurs, classes choisies, recherche de professeurs (comptes AE),
   demandes de libération, cycle/matière et dispenses étaient enregistrés uniquement sur le téléphone qui les créait.
   Ils sont maintenant envoyés à Firebase et reçus par tous les appareils. */
(function(){
  if (typeof syFlat !== 'function' || typeof syApply !== 'function') return;
  var AE_DEF = [['AE Français','Français'],['AE Anglais','Anglais'],['AE Hist-Géo','Hist-Géo'],['AE Philo','Philosophie'],
    ['AE Espagnol','Espagnol'],['AE Allemand','Allemand'],['AE Maths','Maths'],['AE SVT','SVT'],
    ['AE PCT','PCT'],['AE Économie','Économie'],['AE EPS','EPS'],['AE Informatique','Informatique']];
  var EX = { epass:1, esel:1, esubj:1, ecycle:1, ereq:1, enotes:1, ppex:1, ae:1,
           ppeduc:1, pplist:1, ppcond:1, ppacc:1, bulblock:1, flag:1, etab:1, nm:1, nr:1, nb:1 };
  var enc = function(s){ return encodeURIComponent(String(s)); };
  var dec = function(s){ try { return decodeURIComponent(s); } catch (e) { return s; } };
  var J = JSON.stringify;
  function isEmpty(o){ return !o || !Object.keys(o).length; }

  /* Ce que l'on envoie : on ignore les enregistrements « vides » créés automatiquement à l'affichage,
     pour qu'un téléphone neuf n'écrase jamais les vraies données d'un autre. */
  var baseFlat = syFlat;
  syFlat = function(){
    var f = baseFlat.apply(this, arguments);
    try {
      var k;
      for (k in (db.espPass || {})) if (db.espPass[k]) f['epass/' + enc(k)] = J(db.espPass[k]);
      for (k in (db.espSel || {})) if ((db.espSel[k] || []).length) f['esel/' + enc(k)] = J(db.espSel[k]);
      for (k in (db.espSubj || {})) if (db.espSubj[k]) f['esubj/' + enc(k)] = J(db.espSubj[k]);
      for (k in (db.espCycle || {})) if (db.espCycle[k]) f['ecycle/' + enc(k)] = J(db.espCycle[k]);
      for (k in (db.espReq || {})) if (db.espReq[k]) f['ereq/' + enc(k)] = J(db.espReq[k]);
      Object.keys(db.espNotes || {}).forEach(function(key){
        var byC = db.espNotes[key] || {};
        Object.keys(byC).forEach(function(cid){
          var N = byC[cid];
          if (!N) return;
          var s = J(N);
          if (s === '{"coef":1,"rows":{},"rows2":{}}' || s === '{"coef":1,"rows":{}}') return;
          f['enotes/' + enc(key) + '/' + enc(cid)] = s;
        });
      });
      Object.keys(db.ppExempt || {}).forEach(function(cid){ if (!isEmpty(db.ppExempt[cid])) f['ppex/' + enc(cid)] = J(db.ppExempt[cid]); });
      /* Un AE par défaut jamais modifié (vide, sans code) n'est pas envoyé, sauf s'il a déjà été synchronisé
         (ex. liste vidée) : sinon les listes des autres téléphones seraient écrasées par des AE vides. */
      (db.aeAccts || []).forEach(function(a){
        if (!a || !a.id) return;
        var key = 'ae/' + enc(a.id);
        var pristine = !a.pass && isEmpty(a.profs) && /^ae\d+$/.test(a.id);
        if (!pristine || (sy && sy.meta && (key in sy.meta))) f[key] = J(a);
      });
      /* sync v3 : matricules, PP, conduites, codes PP, blocages, drapeaux */
      Object.keys(db.ppEduc || {}).forEach(function(cid){
        var byS = db.ppEduc[cid] || {};
        Object.keys(byS).forEach(function(sid){
          f['ppeduc/' + enc(cid) + '/' + enc(sid)] = J(String(byS[sid] || ''));
        });
      });
      Object.keys(db.ppCond || {}).forEach(function(cid){
        var byS = db.ppCond[cid] || {};
        Object.keys(byS).forEach(function(sid){
          if (byS[sid]) f['ppcond/' + enc(cid) + '/' + enc(sid)] = J(byS[sid]);
        });
      });
      (db.ppList || []).forEach(function(p){ if (p && p.id) f['pplist/' + enc(p.id)] = J(p); });
      Object.keys(db.ppAcc || {}).forEach(function(cid){
        if (db.ppAcc[cid]) f['ppacc/' + enc(cid)] = J(db.ppAcc[cid]);
      });
      Object.keys(db.bulBlock || {}).forEach(function(kind){
        f['bulblock/' + enc(kind)] = J(!!db.bulBlock[kind]);
      });
      ['addSGV1', 'sgFnV1', 'hessouV1'].forEach(function(name){
        if (db[name] !== undefined) f['flag/' + enc(name)] = J(db[name]);
      });
      if (db.etab) f['etab'] = J(db.etab);
      /* v6 : notes découpées par cellule (une clé par élève et par période) : deux saisies simultanées ne s'écrasent plus */
      Object.keys(db.espNotes || {}).forEach(function(key){
        var byC = db.espNotes[key] || {};
        Object.keys(byC).forEach(function(cid){
          var N = byC[cid]; if (!N) return;
          var kk = enc(key) + '/' + enc(cid);
          if (N.coef !== undefined) f['nm/' + kk] = J({ coef: N.coef });
          var secs = [[1, N.rows], [2, N.rows2]];
          secs.forEach(function(pair){
            var R = pair[1] || {};
            Object.keys(R).forEach(function(sid){ if (R[sid]) f['nr/' + kk + '/' + pair[0] + '/' + enc(sid)] = J(R[sid]); });
          });
          var B = N.apBil || {};
          Object.keys(B).forEach(function(sid){ if (B[sid]) f['nb/' + kk + '/' + enc(sid)] = J(B[sid]); });
        });
      });
    } catch (e) {}
    return f;
  };

  /* Ce que l'on reçoit */
  var baseApply = syApply;
  syApply = function(k, s){
    var p = k.split('/'), t = p[0];
    if (!EX[t]) return baseApply.apply(this, arguments);
    var v = null;
    if (s !== null) { try { v = JSON.parse(s); } catch (e) { return; } }
    function put(name){
      var m = db[name] = db[name] || {}, key = dec(p[1]);
      if (v === null) delete m[key]; else m[key] = v;
    }
    if (t === 'epass') put('espPass');
    else if (t === 'esel') put('espSel');
    else if (t === 'esubj') put('espSubj');
    else if (t === 'ecycle') put('espCycle');
    else if (t === 'ereq') put('espReq');
    else if (t === 'ppex') put('ppExempt');
    else if (t === 'enotes') {
      /* v6 : ignoré à la réception ; les notes sont lues depuis nm/nr/nb */
    }
    else if (t === 'ae') {
      if (!db.aeAccts) db.aeAccts = AE_DEF.map(function(d, i){ return { id: 'ae' + (i + 1), name: d[0], mat: d[1], pass: '', profs: [] }; });
      var id = dec(p[1]), a = db.aeAccts, i = a.findIndex(function(x){ return x.id === id; });
      if (v === null) { if (i >= 0) a.splice(i, 1); }
      else if (i >= 0) a[i] = v; else a.push(v);
      try { if (window.espRefreshBox) window.espRefreshBox(); } catch (e) {}
    }
    else if (t === 'ppeduc' || t === 'ppcond') {
      var mapName = t === 'ppeduc' ? 'ppEduc' : 'ppCond';
      var cidX = dec(p[1]), sidX = dec(p[2]), mm = db[mapName] = db[mapName] || {};
      if (v === null || v === '') { if (mm[cidX]) delete mm[cidX][sidX]; }
      else (mm[cidX] = mm[cidX] || {})[sidX] = v;
    }
    else if (t === 'pplist') {
      var pid = dec(p[1]), LST = db.ppList = db.ppList || [];
      var ix = LST.findIndex(function(x){ return x.id === pid; });
      if (v === null) { if (ix >= 0) LST.splice(ix, 1); }
      else if (ix >= 0) LST[ix] = v; else LST.push(v);
    }
    else if (t === 'ppacc') {
      var cA = dec(p[1]), mA = db.ppAcc = db.ppAcc || {};
      if (v === null) delete mA[cA]; else mA[cA] = v;
    }
    else if (t === 'bulblock') {
      var kB = dec(p[1]), mB = db.bulBlock = db.bulBlock || {};
      if (v === null) delete mB[kB]; else mB[kB] = v;
    }
    else if (t === 'flag') {
      if (v !== null) db[dec(p[1])] = v;
    }
    else if (t === 'etab') {
      if (v !== null) db.etab = v;
      try { if (window.render) render(); } catch (e) {}
    }
    else if (t === 'nm' || t === 'nr' || t === 'nb') {
      var nKey = dec(p[1]), nCid = dec(p[2]);
      db.espNotes = db.espNotes || {};
      db.espNotes[nKey] = db.espNotes[nKey] || {};
      var NN = db.espNotes[nKey][nCid] = db.espNotes[nKey][nCid] || { coef: 1, rows: {}, rows2: {} };
      if (!NN.rows) NN.rows = {};
      if (!NN.rows2) NN.rows2 = {};
      if (t === 'nm') {
        if (v && v.coef !== undefined) NN.coef = v.coef;
      } else if (t === 'nr') {
        var nSem = Number(p[3]), nSid = dec(p[4]), nRows = nSem === 2 ? NN.rows2 : NN.rows;
        if (v === null) delete nRows[nSid]; else nRows[nSid] = v;
      } else {
        var bSid = dec(p[3]); NN.apBil = NN.apBil || {};
        if (v === null) delete NN.apBil[bSid]; else NN.apBil[bSid] = v;
      }
      try { if (window.render) render(); } catch (e) {}
    }

    if (['ppeduc','ppcond','pplist','ppacc','bulblock'].indexOf(t) >= 0) {
      try { if (window.render) render(); } catch (e) {}
    }
  };

  /* Force un nouvel envoi complet des nouvelles données au premier lancement de cette version */
  try { if (sy && sy.init) { sy.fullAt = 0; sySave(); } } catch (e) {}
  try { setTimeout(function(){ if (syOn()) { syDiff(); sySave(); syRun(); } }, 1500); } catch (e) {}
})();
</script>

<script>
/* Collège et année scolaire : réglage unique, synchronisé, utilisé dans les bulletins et les PDF */
(function(){
  window.etabNom = function(){ return (db.etab && db.etab.nom) || 'CEG1 ALLADA'; };
  window.etabAnnee = function(){ return (db.etab && db.etab.annee) || '2026-2027'; };
  window.etabAnneeLabel = function(){ return 'Année Scolaire ' + window.etabAnnee(); };
  function canEdit(){
    var u = (typeof me !== 'undefined') ? me : null;
    return !!u && (u.role === 'master' || u.role === 'sup' || u.role === 'surv' || u.id === 'cens');
  }
  function he(x){ return String(x == null ? '' : x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  window.etabOpen = function(){
    if (document.getElementById('etabMod')) return;
    var o = document.createElement('div');
    o.id = 'etabMod';
    o.style.cssText = 'position:fixed;inset:0;z-index:70;background:rgba(20,22,40,.5);display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML = '<div style="background:#fff;color:#111;border-radius:14px;padding:20px;max-width:420px;width:100%">' +
      '<h3 style="margin:0 0 12px">🏫 Collège et année scolaire</h3>' +
      '<label style="display:block;margin-bottom:10px">Nom du collège<br><input id="etabN" value="' + he(window.etabNom()) + '" style="width:100%;padding:8px;box-sizing:border-box"></label>' +
      '<label style="display:block;margin-bottom:14px">Année scolaire (ex. 2026-2027)<br><input id="etabA" value="' + he(window.etabAnnee()) + '" style="width:100%;padding:8px;box-sizing:border-box"></label>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end"><button onclick="document.getElementById(\'etabMod\').remove()">Annuler</button><button onclick="etabSave()">Enregistrer</button></div></div>';
    document.body.appendChild(o);
  };
  window.etabSave = function(){
    var n = (document.getElementById('etabN').value || '').trim().slice(0, 120);
    var a = (document.getElementById('etabA').value || '').trim().slice(0, 30);
    if (!n || !a) return alert('Renseigne le nom du collège et l\'année scolaire.');
    db.etab = { nom: n, annee: a };
    try { save(); } catch (e) {}
    document.getElementById('etabMod').remove();
    try { render(); } catch (e) {}
    alert('Enregistré : ' + n + ' · ' + window.etabAnneeLabel());
  };
  var btn = document.createElement('button');
  btn.textContent = '🏫 Collège & année';
  btn.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:50;display:none;padding:8px 12px;border-radius:12px;font-size:13px';
  btn.onclick = function(){ window.etabOpen(); };
  document.body.appendChild(btn);
  setInterval(function(){ btn.style.display = canEdit() ? 'block' : 'none'; }, 800);
})();
</script>
<script id="compte-prof">
/* COMPTE Prof : le MasterLog gère les comptes Les AE, Prof et PP (réinitialiser, modifier, supprimer, bloquer) */
(function(){
  var tab = null, ov = null;
  function isM(){ return typeof me !== 'undefined' && !!me && me.role === 'master'; }
  function nrm(x){ return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(); }
  function pkey(p){ return nrm(p.nom) + '|' + nrm(p.prenoms); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function aes(){ return db.aeAccts || []; }
  function profs(){
    var seen = {}, l = [];
    aes().forEach(function(a){ (a.profs || []).forEach(function(p){
      var pv = nrm(p.prov || '').replace(/[^A-Z0-9]/g, ''); if (pv !== '' && pv !== 'CEG1ALLADA') return;
      var k = pkey(p); if (seen[k]) return; seen[k] = 1; l.push({ k: k, name: (p.nom || '') + ' ' + (p.prenoms || '') });
    }); });
    return l.sort(function(a, b){ return a.name.localeCompare(b.name, 'fr'); });
  }
  function profBlocked(k){ return aes().some(function(a){ return (a.profs || []).some(function(p){ return pkey(p) === k && p.blocked; }); }); }
  function setProfBlocked(k, v){ aes().forEach(function(a){ (a.profs || []).forEach(function(p){ if (pkey(p) === k) { if (v) p.blocked = true; else delete p.blocked; } }); }); }
  function rows(){
    if (tab === 'ae') return aes().map(function(a){ return { k: a.id, n: a.name, s: a.pass ? 'Code défini' : 'Pas de code', b: !!a.blocked }; });
    if (tab === 'prof') return profs().map(function(p){ return { k: p.k, n: p.name, s: (db.espPass || {})[p.k] ? 'Compte actif' : 'Pas de compte', b: profBlocked(p.k) }; });
    if (tab === 'pp') return (db.classes || []).map(function(c){ var a = (db.ppAcc || {})[c.id]; return { k: c.id, n: 'PP ' + (c.name || c.nom || c.id), s: a ? 'Identifiant : ' + a.id : 'Pas d’accès', b: !!(a && a.blocked) }; });
    return [];
  }
  function paint(){
    if (!ov) return;
    var T = { ae: 'Les AE', prof: 'Prof', pp: 'PP' };
    var h = '<div style="max-width:900px;margin:0 auto;padding:12px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:18px">🔑 COMPTE Prof</b><button class="s" data-x="close">✕ Fermer</button></div><div class="row" style="gap:8px;margin-bottom:10px">';
    Object.keys(T).forEach(function(t){ h += '<button' + (tab === t ? '' : ' class="s"') + ' data-tab="' + t + '" style="flex:1">' + T[t] + '</button>'; });
    h += '</div>';
    if (!tab) h += '<p class="mu">Choisis Les AE, Prof ou PP.</p>';
    else {
      var r = rows(); if (!r.length) h += '<p class="mu">Aucun compte.</p>';
      r.forEach(function(x){
        var d = ' data-t="' + tab + '" data-k="' + encodeURIComponent(x.k) + '"';
        h += '<div class="card" style="margin:6px 0"><b>' + esc(x.n) + '</b>' + (x.b ? ' <span style="color:#c0392b">🔒 Bloqué</span>' : '') + '<div class="mu">' + esc(x.s) + '</div><div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">' +
          '<button class="s" data-a="reset"' + d + '>Réinitialiser</button><button class="s" data-a="edit"' + d + '>Modifier</button>' +
          '<button class="d" data-a="del"' + d + '>Supprimer</button><button class="s" data-a="blk"' + d + '>' + (x.b ? 'Débloquer' : 'Bloquer') + '</button></div></div>';
      });
    }
    ov.firstChild.innerHTML = h + '</div>';
  }
  function done(){ try { save(); } catch (e) {} paint(); try { render(); } catch (e) {} }
  function pw2(msg){
    var a = prompt(msg || 'Nouveau mot de passe (minimum 4 caractères) :'); if (a === null) return null;
    if (a.length < 4) { alert('Le mot de passe doit contenir au moins 4 caractères.'); return null; }
    return a;
  }
  function act(t, k, a){
    var o, c;
    if (t === 'ae') {
      o = aes().find(function(x){ return x.id === k; }); if (!o) return;
      if (a === 'reset') { if (confirm('Réinitialiser « ' + o.name + ' » ? L’AE devra créer un nouveau code.')) { o.pass = ''; done(); } }
      else if (a === 'edit') { var n = prompt('Nom du compte AE :', o.name); if (n === null) return; var p = pw2('Nouveau code d’accès (minimum 4 caractères) :'); if (p === null) return; if (n.trim()) o.name = n.trim(); o.pass = p; done(); }
      else if (a === 'del') { if (confirm('Supprimer « ' + o.name + ' » et ses professeurs ?')) { db.aeAccts = aes().filter(function(x){ return x.id !== k; }); done(); } }
      else { o.blocked = !o.blocked; if (!o.blocked) delete o.blocked; done(); }
    } else if (t === 'prof') {
      db.espPass = db.espPass || {}; db.espSel = db.espSel || {};
      if (a === 'reset') { if (!db.espPass[k]) return alert('Ce professeur n’a pas de compte.'); if (confirm('Réinitialiser ce compte ? Le professeur devra recréer son mot de passe.')) { delete db.espPass[k]; done(); } }
      else if (a === 'edit') { var q = pw2(); if (q === null) return; if (Object.keys(db.espPass).some(function(x){ return x !== k && db.espPass[x] === q; })) return alert('Une erreur s’est produite.'); db.espPass[k] = q; done(); alert('Mot de passe changé.'); }
      else if (a === 'del') { if (!db.espPass[k]) return alert('Ce professeur n’a pas de compte.'); if (confirm('Supprimer le compte de ce professeur ? Ses notes sont conservées.')) { delete db.espPass[k]; delete db.espSel[k]; done(); } }
      else { setProfBlocked(k, !profBlocked(k)); done(); }
    } else {
      db.ppAcc = db.ppAcc || {}; o = db.ppAcc[k];
      if (a === 'blk') { if (!o) return alert('Aucun accès PP pour cette classe.'); o.blocked = !o.blocked; if (!o.blocked) delete o.blocked; return done(); }
      if (!o) { if (a === 'edit') { o = db.ppAcc[k] = { id: '', pass: '' }; } else return alert('Aucun accès PP pour cette classe.'); }
      if (a === 'reset') { c = String(Math.floor(1000 + Math.random() * 9000)); if (confirm('Réinitialiser l’accès ? Un mot de passe temporaire sera créé.')) { o.pass = c; done(); alert('Identifiant : ' + o.id + '\nMot de passe temporaire : ' + c); } }
      else if (a === 'edit') {
        var id = prompt('Identifiant (CEG001M à CEG199M, se termine par M) :', o.id); if (id === null) { if (!o.id) delete db.ppAcc[k]; return; }
        id = id.trim().toUpperCase();
        if (!/^CEG(00[1-9]|0[1-9]\d|1\d\d)M$/.test(id)) { if (!o.id) delete db.ppAcc[k]; return alert('Identifiant invalide (ex. CEG111M).'); }
        if (Object.keys(db.ppAcc).some(function(x){ return x !== k && db.ppAcc[x] && db.ppAcc[x].id === id; })) { if (!o.id) delete db.ppAcc[k]; return alert('Cet identifiant est déjà attribué.'); }
        var pw = pw2('Mot de passe (minimum 4 caractères) :'); if (pw === null) { if (!o.id) delete db.ppAcc[k]; return; }
        o.id = id; o.pass = pw; done();
      }
      else if (confirm('Supprimer l’accès PP de cette classe ?')) { delete db.ppAcc[k]; done(); }
    }
  }
  function open(){
    if (!isM()) return;
    if (!ov) {
      ov = document.createElement('div'); ov.id = 'cptov';
      ov.style.cssText = 'position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto'; ov.innerHTML = '<div></div>';
      ov.addEventListener('click', function(e){
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.x) { ov.hidden = true; return; }
        if (b.dataset.tab) { tab = b.dataset.tab; return paint(); }
        if (b.dataset.a) act(b.dataset.t, decodeURIComponent(b.dataset.k), b.dataset.a);
      });
      document.body.appendChild(ov);
    }
    ov.hidden = false; paint();
  }
  /* Blocage effectif à la connexion */
  var u1 = window.aeUnlock, u2 = window.aeSetup, u3 = window.ppLogin, u4 = window.espLogin;
  function aeGuard(f){ return function(id){ var a = aes().find(function(x){ return x.id === id; }); if (a && a.blocked) return alert('Ce compte est bloqué par le MasterLog.'); return f.apply(this, arguments); }; }
  if (u1) window.aeUnlock = aeGuard(u1);
  if (u2) window.aeSetup = aeGuard(u2);
  if (u3) window.ppLogin = function(cid){ var a = (db.ppAcc || {})[cid]; if (a && a.blocked) return alert('Ce compte est bloqué par le MasterLog.'); return u3.apply(this, arguments); };
  if (u4) window.espLogin = function(){
    var pw = (document.getElementById('espPw') || {}).value || '', P = db.espPass || {};
    if (Object.keys(P).some(function(k){ return P[k] === pw && profBlocked(k); })) return alert('Ce compte est bloqué par le MasterLog.');
    return u4.apply(this, arguments);
  };
  /* Bouton dans l'en-tête, à côté de « Les AE et PP » */
  var pr = window.render;
  window.render = function(){
    var r = pr.apply(this, arguments);
    try {
      if (isM() && !document.getElementById('bcpt')) {
        var lo = Array.from(document.querySelectorAll('header button')).find(function(x){ return x.getAttribute('onclick') === 'logout()'; });
        if (lo) { var b = document.createElement('button'); b.id = 'bcpt'; b.className = 's'; b.textContent = '🔑 COMPTE Prof'; b.onclick = open; lo.parentNode.insertBefore(b, lo); }
      }
    } catch (e) {}
    return r;
  };
})();
</script>
