<style>

/* Couleurs des boutons dans les comptes : valeurs FIXES, identiques sur téléphone, tablette et ordinateur */

<body>
<div id="app"></div>
<script>
/* ===== Couche de données (à remplacer par une API + base de données à l'hébergement) ===== */
const KEY='gestion_eleves_v2';
const hs=t=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const MASTER_MAILS_H='1yb4o0qqdjl'; /* empreinte de récupération de MasterLog */
const MASTER_TEL='0195185256'; /* numéro de MasterLog (WhatsApp / SMS) */
function seed(){
  const N=['SG AMIKPÉMI','SG CRECEL','SG GAHOUNGA','SG SOSSOUKPE','SG MIGAN','SG A DÉFINIR 1','SG A DÉFINIR 2','SG A DÉFINIR 3','SG A DÉFINIR 4','SG A DÉFINIR 5'];
  const u=[{id:'de',name:'Le Directeur',login:'de',pass:'de123',role:'de'},{id:'cens',name:'Le Censeur/Comptable',login:'censeur',pass:'cens123',role:'de'},{id:'sup',name:'Superviseur (Le SG)',login:'superviseur',pass:'admin123',role:'sup'}];
  N.forEach((n,i)=>u.push({id:'s'+(i+1),name:n,login:'sga'+(i+1),pass:'1234',role:'surv'}));
  return {users:u,classes:[],students:[]};
}
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()}
if(!db.users.some(u=>u.id==='cens'))db.users.splice(1,0,{id:'cens',name:'Le Censeur/Comptable',login:'censeur',pass:'cens123',role:'de'});
if(!db.users.some(u=>u.id==='master'))db.users.push({id:'master',name:'MasterLog',login:'masterlog',pass:'',role:'master'});
db.abs=db.abs||{};
db.reqs=db.reqs||[];db.msgs=db.msgs||[];db.ext=db.ext||{};db.set=db.set||{};
if(!db.v3){db.users.forEach(u=>{if(['1234','de123','cens123','admin123'].includes(u.pass))u.pass=''});db.v3=1}
const okCode=c=>/^[A-Za-z0-9]{4,}$/.test(c);
db.users.forEach(u=>{if(u.id==='cens'&&(u.name==='Le Censeur'||u.name==='Censeur'))u.name='Le Censeur/Comptable';if(u.id==='de'&&(u.name==='DE'||u.name==='Directeur'))u.name='Le Directeur';if(u.id==='sup'&&u.name==='Superviseur')u.name='Superviseur (Le SG)'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Sauvegarde impossible')}syAfterSave()}
const uid=()=>Math.random().toString(36).slice(2,10);

/* ===== Synchronisation multi-appareils (Firebase Realtime Database, API REST) ===== */
const SY_KEY='gestion_eleves_sync_v1';
let sy;try{sy=JSON.parse(localStorage.getItem(SY_KEY))||{}}catch(e){sy={}}
sy.meta=sy.meta||{};
/* >>> Renseigne ici ton adresse Firebase et ton code de synchronisation : la synchronisation sera automatique sur tous les appareils <<< */
const SY_URL='';  /* exemple : 'https://mon-projet-default-rtdb.firebaseio.com' */
const SY_ROOM=''; /* exemple : 'ceg1allada2026secret' (12 caractères minimum, lettres/chiffres/_/-) */
if(SY_URL&&SY_ROOM&&(sy.url!==SY_URL.replace(/\/+$/,'')||sy.room!==SY_ROOM)){sy={url:SY_URL.replace(/\/+$/,''),room:SY_ROOM,init:0,meta:{}};try{localStorage.setItem(SY_KEY,JSON.stringify(sy))}catch(e){}}
const syStat={st:'',last:0};let syBusy=0,syTm=null,syPend=0,syNew=0;
const syOn=()=>!!(sy.url&&sy.room);
const syT=()=>Date.now()+(sy.off||0);
const sySave=()=>{try{localStorage.setItem(SY_KEY,JSON.stringify(sy))}catch(e){}};
const syF=k=>k.replace(/[%.$#\[\]\/]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'));
const syD=k=>decodeURIComponent(k);
/* Ajout des comptes SG 9 et 10 sur les appareils déjà installés (sans écraser ce que la synchronisation a déjà récupéré) */
[['s9','SG A DÉFINIR 4','sga9'],['s10','SG A DÉFINIR 5','sga10']].forEach(([id,name,login])=>{
  if(db.users.some(u=>u.id===id))return;
  const o={id,name,login,pass:'',role:'surv'};db.users.push(o);
  if(sy.init){sy.meta['users/'+id]={t:0,s:JSON.stringify(o),d:0};sySave()}
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}});
function syFlat(){
  const f={};
  (db.users||[]).forEach(o=>f['users/'+o.id]=JSON.stringify(o));
  (db.classes||[]).forEach(o=>f['classes/'+o.id]=JSON.stringify(o));
  (db.students||[]).forEach(o=>f['students/'+o.id]=JSON.stringify(o));
  (db.reqs||[]).forEach(o=>f['reqs/'+o.u]=JSON.stringify(o));
  (db.msgs||[]).forEach(o=>f['msgs/'+o.id]=JSON.stringify(o));
  Object.entries(db.set||{}).forEach(([k,v])=>f['set/'+k]=JSON.stringify(v));
  ['abs','ext'].forEach(n=>Object.entries(db[n]||{}).forEach(([d,day])=>Object.entries(day||{}).forEach(([sid,r])=>f[n+'/'+d+'/'+sid]=JSON.stringify(r))));
  return f}
function syDiff(){
  const f=syFlat(),n=syT();let ch=0;
  for(const k in f){const m=sy.meta[k];if(!m||m.s!==f[k]){sy.meta[k]={t:n,s:f[k],d:1};ch++}}
  for(const k in sy.meta){const m=sy.meta[k];if(!(k in f)&&m.s!==null){sy.meta[k]={t:n,s:null,d:1};ch++}}
  return ch}
function syApply(k,s){
  const p=k.split('/'),t=p[0];
  if(t==='users'||t==='classes'||t==='students'||t==='reqs'||t==='msgs'){
    const idk=t==='reqs'?'u':'id',a=db[t]=db[t]||[],i=a.findIndex(o=>o[idk]===p[1]);
    if(s===null){if(i>=0)a.splice(i,1)}else{const o=JSON.parse(s);if(t==='msgs'&&i<0&&me&&o.from!==me.id&&(o.to==='all'||o.to===me.id))syNew++;if(i>=0)a[i]=o;else a.push(o)}
  }else if(t==='set'){db.set=db.set||{};if(s===null)delete db.set[p[1]];else db.set[p[1]]=JSON.parse(s)}
  else if(t==='abs'||t==='ext'){
    const m=db[t]=db[t]||{};
    if(s===null){if(m[p[1]]){delete m[p[1]][p[2]];if(!Object.keys(m[p[1]]).length)delete m[p[1]]}}
    else(m[p[1]]=m[p[1]]||{})[p[2]]=JSON.parse(s)}}
function syTxt(){
  if(!syOn())return 'désactivée';
  if(syStat.st==='sync')return 'en cours…';
  if(syStat.st==='err')return 'hors ligne';
  if(syStat.last){const s=Math.round((Date.now()-syStat.last)/1000);return 'à jour'+(s<90?'':' · il y a '+Math.round(s/60)+' min')}
  return 'en attente'}
function syUI(){document.querySelectorAll('.syt').forEach(e=>e.textContent=syTxt())}
function syAfterSave(){if(!syOn())return;if(syDiff())sySave();clearTimeout(syTm);syTm=setTimeout(syRun,1200)}
function syRefresh(){
  if(me&&view.page==='msg'){msgPaint();return}
  msgBadge();
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){syPend=1;return}
  const y=scrollY;render();scrollTo(0,y)}
async function syRun(){
  if(!syOn()||syBusy)return;
  syBusy=1;syStat.st='sync';syUI();
  try{
    const b0=sy.url.replace(/\/+$/,'')+'/rooms/'+encodeURIComponent(sy.room),base=b0+'/e';
    if(!sy.offAt||Date.now()-sy.offAt>1800000){
      try{const a=Date.now(),q=await fetch(b0+'/ping.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({'.sv':'timestamp'})});
        if(q.ok){const v=await q.json(),b=Date.now();if(typeof v==='number'){sy.off=v-(a+b)/2;sy.offAt=b}}}catch(e){}}
    const W=(sy.since||0)-120000;
    let inc=!!(sy.init&&sy.since&&!sy.noIdx&&Date.now()-(sy.fullAt||0)<600000);
    if(inc)for(const k in sy.meta){const m=sy.meta[k];if(m.d&&m.t<W){inc=false;break}}
    let rem=null;
    if(inc){
      const r=await fetch(base+'.json?orderBy=%22t%22&startAt='+W,{cache:'no-store'});
      if(r.ok)rem=(await r.json())||{};else if(r.status===400)sy.noIdx=1;
    }
    if(rem===null){
      const r=await fetch(base+'.json',{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      rem=(await r.json())||{};sy.fullAt=Date.now();
    }
    const n=syT(),firstRun=!sy.init;syNew=0;
    for(const fk in rem){const R=rem[fk];if(R&&typeof R.t==='number'&&R.t>(sy.since||0))sy.since=R.t}
    if(!sy.init){
      const f=syFlat();
      for(const k in f){const has=syF(k) in rem;sy.meta[k]={t:has?0:n,s:f[k],d:has?0:1}}
      sy.init=1;
    }else syDiff();
    let chg=0;const up={};
    const keys=new Set(Object.keys(rem).map(syD));for(const k in sy.meta)keys.add(k);
    keys.forEach(k=>{
      const R=rem[syF(k)],m=sy.meta[k];
      if(R&&typeof R==='object'&&(!m||R.t>m.t)){
        const s=typeof R.v==='string'?R.v:null;
        if(!m||m.s!==s){syApply(k,s);chg++}
        sy.meta[k]={t:R.t,s,d:0};
      }else if(m&&m.d&&(!R||m.t>R.t))up[syF(k)]={t:m.t,v:m.s};
    });
    if(Object.keys(up).length){
      const p=await fetch(base+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(up)});
      if(!p.ok)throw new Error('HTTP '+p.status);
      for(const fk in up){const k=syD(fk);if(sy.meta[k]&&sy.meta[k].t===up[fk].t)sy.meta[k].d=0}
    }
    sySave();
    if(syNew){if(!firstRun)msgBeep();syNew=0}
    if(chg){
      me=me?(db.users.find(u=>u.id===me.id)||null):null;
      try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
      syStat.st='ok';syStat.last=Date.now();syBusy=0;syRefresh();
    }
    syStat.st='ok';syStat.last=Date.now();
  }catch(e){syStat.st='err'}
  syBusy=0;syUI()}
document.addEventListener('focusout',()=>setTimeout(()=>{
  if(!syPend)return;const a=document.activeElement;
  if(!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){syPend=0;syRefresh()}},300));
let syTick=0;
setInterval(()=>{syTick++;if(syOn()&&!document.hidden&&(syTick%3===0||(me&&view.page==='msg')))syRun();syUI()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syRun()});
addEventListener('online',syRun);
setTimeout(syRun,800);
document.addEventListener('touchstart',()=>{},{passive:true});
const syMaster=()=>!!(me&&me.role==='master');
function syConn(url,room){
  url=(url||'').trim().replace(/\/+$/,'');room=(room||'').trim();
  if(syOn()&&!syMaster())return alert('Seul MasterLog peut modifier la synchronisation.');
  if(!/^https:\/\/[^\s\/]+\.[^\s]+$/.test(url))return alert('Adresse invalide. Elle doit commencer par https:// (exemple : https://mon-projet-default-rtdb.firebaseio.com)');
  if(!/^[A-Za-z0-9_-]{12,}$/.test(room))return alert('Le code de synchronisation doit avoir au moins 12 lettres/chiffres, sans espace. Utilise « Générer ».');
  sy={url,room,init:0,meta:{}};sySave();syStat.st='';syStat.last=0;syRun();render()}
function syForm(){syConn($('syu').value,$('syr').value)}
function syGen(){
  const a=new Uint8Array(12);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<12;i++)a[i]=Math.floor(Math.random()*256);
  $('syr').value=Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,20)}
function syJoin(){

function normSex(v){const s=String(v||'').trim().toLowerCase();
  if(/^(m|g|h)/.test(s))return'M'; if(/^f/.test(s))return'F'; return null}
function check(name,sex,phone,cid,batch=[]){
  name=String(name||'').trim().replace(/\s+/g,' ');phone=String(phone||'').trim();sex=normSex(sex);
  if(!name)return{err:'Nom manquant'};
  if(!sex)return{err:'Sexe invalide (M/F)'};
  if(phone.replace(/\D/g,'').length<6)return{err:'Téléphone manquant ou invalide'};
  const k=name.toLowerCase()+'|'+phone.replace(/\D/g,'');
  const dup=x=>x.name.toLowerCase()+'|'+x.phone.replace(/\D/g,'')===k;
  if(db.students.some(s=>s.cid===cid&&dup(s))||batch.some(dup))return{err:'Doublon'};
  return{name,sex,phone};
}
async function importFile(f){
  if(!f)return;let rows=[];
  try{
    const buf=await f.arrayBuffer();
    if(/\.docx$/i.test(f.name)){
      const h=(await mammoth.convertToHtml({arrayBuffer:buf})).value;
      const d=new DOMParser().parseFromString(h,'text/html');
      d.querySelectorAll('tr').forEach(tr=>rows.push([...tr.children].map(td=>td.textContent.trim())));
    }else{
      const wb=XLSX.read(buf,{type:'array'});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    }
  }catch(e){return alert('Fichier illisible : '+e.message)}
  rows=rows.filter(r=>r.some(x=>String(x).trim()));
  if(rows.length&&/nom/i.test(rows[0][0]))rows.shift();
  const batch=[];pending=rows.map(r=>{
    const x=check(r[0],r[1],r[2],view.cid,batch);
    if(!x.err)batch.push(x);
    return{raw:r,x}});
  render();
}

  return `<div class="card"><h2>📝 Détails du jour · ${frD(view.date)}</h2><p class="mu">Retards pour les présents ; motif, observation et message aux parents pour les absents.</p>
  <div class="wrap"><table><tr><th>Nom complet</th><th>Retard / Absence</th><th>Motif</th><th>Observation</th><th>Parents</th></tr>
  ${st.map(s=>{const a=day[s.id],e=exd(view.date,s.id);
    return `<tr><td>${esc(s.name)}</td>`+(a?`<td class="er"><b>${a.m&&a.s?'Journée':a.m?'Matin':'Soir'}</b></td>
    <td><select onchange="exSet('${s.id}','mo',this.value);render()"><option value="">Non précisé</option>${MOTIFS.map(m=>`<option ${e.mo===m?'selected':''}>${m}</option>`).join('')}</select></td>
    <td><input value="${esc(e.ob||'')}" placeholder="Observation" onchange="exSet('${s.id}','ob',this.value.trim())"></td>
    <td><button class="s sm" onclick="parentMsg('${s.id}','sms')">💬 SMS</button> <button class="s wa" onclick="parentMsg('${s.id}','wa')">WhatsApp</button></td>`
    :`<td><button class="ab ar ${e.rt?'on':''}" onclick="exTog('${s.id}','rt')">Retard</button></td><td></td><td></td><td></td>`)+'</tr>'}).join('')||'<tr><td colspan="5" class="mu">Aucun élève.</td></tr>'}</table></div></div>`}
function xStats(c){
  const{P,R}=xCalc(db.students.filter(s=>s.cid===c.id)),sv=seuilV(),tot=R.reduce((a,o)=>a+o.dj,0),poss=R.length*P.n*2;
  R.sort((x,y)=>y.dj-x.dj||x.s.name.localeCompare(y.s.name,'fr'));
  return `<div class="card"><h2>📊 Statistiques de la classe</h2>
  <div class="row">${perSel()}<span class="mu">Seuil d'alerte :</span><input type="number" min="1" value="${sv}" style="width:80px" onchange="setSeuil(this.value)"><span class="mu">demi-journées</span></div>
  <p><b>Présence de la classe : ${taux(tot,poss)} %</b> <span class="mu">· ${tot} demi-journée(s) d'absence sur ${poss} possibles (${P.n} jours, lundi au vendredi)</span></p>
  <div class="wrap"><table><tr><th>Nom complet</th><th>Demi-journées</th><th>Justifiées</th><th>Retards</th><th>Présence</th><th></th></tr>
  ${R.map(o=>`<tr><td>${esc(o.s.name)}</td><td>${o.dj}</td><td>${o.ju}</td><td>${o.rt}</td><td>${taux(o.dj,P.n*2)} %</td><td class="er">${o.dj>=sv?'⚠️ À surveiller':''}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Aucun élève.</td></tr>'}</table></div></div>`}
function xDash(){
  const rows=db.classes.map(c=>{const{P,R}=xCalc(db.students.filter(s=>s.cid===c.id));const dj=R.reduce((a,o)=>a+o.dj,0);
    return{c,n:R.length,dj,al:R.filter(o=>o.dj>=seuilV()).length,t:taux(dj,R.length*P.n*2)}}).sort((a,b)=>a.t-b.t);
  const N=rows.reduce((a,r)=>a+r.n,0),D=rows.reduce((a,r)=>a+r.dj,0),P=xPer();
  return `<div class="card wrap"><h2>📊 Tableau de bord des absences</h2>
  <div class="row">${perSel()}<span class="mu">Seuil d'alerte :</span><input type="number" min="1" value="${seuilV()}" style="width:80px" onchange="setSeuil(this.value)"><span class="mu">demi-journées</span></div>
  <p><b>Présence globale : ${taux(D,N*P.n*2)} %</b> <span class="mu">· ${N} élèves · ${D} demi-journée(s) d'absence</span></p>
  <table><tr><th>SGA</th><th>Promotion</th><th>Classe</th><th>Effectif</th><th>Demi-journées</th><th>Présence</th><th>Élèves en alerte</th></tr>
  ${rows.map(r=>`<tr><td>${esc(userName(r.c.owner))}</td><td>${esc(pn(r.c.owner,r.c.promo||'A'))}</td><td>${esc(r.c.name)}</td><td>${r.n}</td><td>${r.dj}</td><td>${r.t} %</td><td class="${r.al?'er':''}">${r.al?'⚠️ '+r.al:'0'}</td></tr>`).join('')||'<tr><td colspan="7" class="mu">Aucune classe.</td></tr>'}</table></div>`}
function addExtras(){
  if(!me||view.page!=='app')return;const m=$('m');if(!m)return;
  if(me.role!=='surv'&&view.tab==='eleves'){m.insertAdjacentHTML('beforeend',xDash());return}
  if(!view.cid||(me.role!=='surv'&&view.tab!=='sga'))return;
  const c=db.classes.find(x=>x.id===view.cid);if(c)m.insertAdjacentHTML('beforeend',xTools(c)+xDetails(c)+xStats(c))}
function upU(id,k,v){const u=db.users.find(x=>x.id===id);
  if(k==='login'&&(!v||db.users.some(x=>x.id!==id&&x.login===v))){alert('Identifiant vide ou déjà utilisé');return render()}
  if(k==='pass'&&v&&!okCode(v)){alert('Le code doit contenir au minimum 4 chiffres et/ou lettres (ou rester vide pour que la personne le recrée)');return render()}
  u[k]=v;if(k==='pass'&&v){u.pcAt=Date.now();u.fails=0;if(u.auto){u.blocked=false;delete u.auto}db.reqs=(db.reqs||[]).filter(r=>r.u!==id)}save()}
function exportX(){const rows=[['Surveillant','Classe','Nom complet','Sexe','Téléphone des parents'],...filtered().map(s=>[userName(s.owner),s.cls,s.name,s.sex==='M'?'Garçon':'Fille',s.phone])];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Élèves');XLSX.writeFile(wb,'eleves.xlsx')}

/* ===== Messagerie interne (synchronisée) ===== */
const msgSeenK=()=>'ge_seen_'+(me?me.id:'');
function msgSeen(){try{return JSON.parse(localStorage.getItem(msgSeenK()))||{}}catch(e){return{}}}
const msgMine=m=>m.to==='all'||m.to===me.id||m.from===me.id;
const msgTh=m=>m.to==='all'?'all':(m.from===me.id?m.to:m.from);
function msgUnread(th){const sn=msgSeen();return(db.msgs||[]).filter(m=>msgMine(m)&&m.from!==me.id&&msgTh(m)===th&&m.t>(sn[th]||0)).length}
function msgTotal(){if(!me)return 0;const sn=msgSeen();return(db.msgs||[]).filter(m=>msgMine(m)&&m.from!==me.id&&m.t>(sn[msgTh(m)]||0)).length}
function msgBadge(){const n=msgTotal();document.title=(n?'('+n+') ':'')+'CEG1 ALLADA - Gestion des élèves';document.querySelectorAll('.mbd').forEach(e=>{e.textContent=n||'';e.style.display=n?'inline-block':'none'})}
function msgPaint(first){
  const el=$('mlist');if(!el||!me)return;
  const th=view.mt||'all',nm=id=>(db.users.find(u=>u.id===id)||{name:'?'}).name,p=n=>String(n).padStart(2,'0');
  const L=(db.msgs||[]).filter(m=>msgMine(m)&&msgTh(m)===th).sort((a,b)=>a.t-b.t).slice(-200);
  const low=first||el.scrollHeight-el.scrollTop-el.clientHeight<60;
  el.innerHTML=L.map(m=>{const mi=m.from===me.id,d=new Date(m.t);
    return `<div class="mrow${mi?' me':''}"><div class="mbub"><div class="mnm">${mi?'Moi':esc(nm(m.from))} · ${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}${(mi||me.role==='master')?` <button class="d mx" onclick="msgDel('${m.id}')">✕</button>`:''}</div>${esc(m.text).replace(/\n/g,'<br>')}</div></div>`}).join('')||'<p class="mu" style="text-align:center">Aucun message. Écris le premier !</p>';
  if(low)el.scrollTop=el.scrollHeight;
  if(L.length){const sn=msgSeen(),mt=Math.max(...L.map(m=>m.t));if((sn[th]||0)<mt){sn[th]=mt;try{localStorage.setItem(msgSeenK(),JSON.stringify(sn))}catch(e){}}}
  msgBadge()}
/* Alerte sonore à l'arrivée d'un message */
let sAC=null;
function sndUnlock(){try{if(!sAC){const C=window.AudioContext||window.webkitAudioContext;if(C)sAC=new C()}if(sAC&&sAC.state==='suspended')sAC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(e=>document.addEventListener(e,sndUnlock,{passive:true}));
const sndOn=()=>{try{return localStorage.getItem('ge_snd')!=='0'}catch(e){return true}};
function msgBeep(){
  if(!sndOn())return;
  try{if(navigator.vibrate)navigator.vibrate([120,60,120])}catch(e){}
  try{
    sndUnlock();if(!sAC||sAC.state!=='running')return;
    const t0=sAC.currentTime;
    [[880,0],[1175,.18]].forEach(([f,d])=>{const o=sAC.createOscillator(),g=sAC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.3);
      o.connect(g);g.connect(sAC.destination);o.start(t0+d);o.stop(t0+d+.32)})
  }catch(e){}}
function msgSnd(){
  const on=!sndOn();try{localStorage.setItem('ge_snd',on?'1':'0')}catch(e){}
  const b=$('msnd');if(b)b.textContent=on?'🔔 Son activé':'🔕 Son coupé';
  if(on)msgBeep()}
function msgSend(){
  const i=$('mt'),t=(i.value||'').trim();if(!t||!me)return;
  db.msgs=db.msgs||[];db.msgs.push({id:uid(),from:me.id,to:view.mt||'all',text:t.slice(0,1000),t:Date.now()});
  i.value='';save();msgPaint(1);i.focus();if(syOn())syRun()}
function msgDel(id){
  const m=(db.msgs||[]).find(x=>x.id===id);if(!m||!me||!(m.from===me.id||me.role==='master'))return;
  if(!confirm('Supprimer ce message pour tout le monde ?'))return;
  db.msgs=db.msgs.filter(x=>x.id!==id);save();msgPaint()}
function msgPage(){
  view.mt=view.mt||'all';
  const opts=[['all','👥 Tout le monde']].concat(db.users.filter(u=>u.id!==me.id).map(u=>[u.id,u.name]));
  return `<main><button class="s" onclick="go('app')">‹ Retour</button><div class="card" style="margin-top:12px;max-width:640px"><h2>💬 Messagerie</h2>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-6px 0 10px;flex-wrap:wrap"><span></span><button class="s" id="msnd" onclick="msgSnd()" style="padding:4px 10px;font-size:12px">${sndOn()?'🔔 Son activé':'🔕 Son coupé'}</button></div>
  <select id="mw" onchange="view.mt=this.value;msgPaint(1)" style="width:100%;margin-bottom:10px">${opts.map(([v,n])=>{const c=msgUnread(v);return `<option value="${esc(v)}"${v===view.mt?' selected':''}>${esc(n)}${c?' ('+c+' nouveau'+(c>1?'x':'')+')':''}</option>`}).join('')}</select>
  <div id="mlist" class="mlist"></div>
  <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="mt" placeholder="Écris ton message…" maxlength="1000" autocomplete="off" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();msgSend()}"><button onclick="msgSend()">Envoyer</button></div>
  <p class="mu" style="margin-top:8px;font-size:12px">Écris à tout le monde ou en privé à une personne. Les messages sont partagés entre tous les appareils reliés par la synchronisation.</p></div></main>`}

render();
</script>
