header b{font-size:17px;font-weight:700;color:var(--pr)}
main{max-width:1000px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
h2{margin:0 0 14px;font-size:19px;font-weight:700;color:var(--tx)}
input,select{padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--mu);opacity:.8}
input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 4px var(--ring)}
button,.btn{padding:10px 16px;border:0;border-radius:12px;background:var(--pr);color:var(--onpr);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s,box-shadow .15s,background .15s,transform .1s;box-shadow:0 1px 3px rgba(60,64,110,.18)}
button:hover,.btn:hover{filter:brightness(1.07)}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed;filter:none}
button.s{background:var(--card);color:var(--pr);border:1.5px solid var(--bd);box-shadow:none}
button.s:hover,.btn.s:hover{background:var(--soft);filter:none}
button.ab{background:transparent;color:var(--mu);border:1.5px solid var(--bd);padding:6px 12px;box-shadow:none;font-weight:600}
button.ab.on{background:var(--er);color:var(--onpr);border-color:var(--er)}
button.d{background:transparent;color:var(--er);border:1.5px solid var(--bd);padding:6px 12px;box-shadow:none}
button.d:hover{background:rgba(192,80,74,.1);filter:none}
button.hb{display:block;width:100%;max-width:340px;margin:0 auto 7px;padding:9px 16px;font-size:16px;font-weight:700;line-height:1.2;border-radius:13px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr);box-shadow:0 6px 16px rgba(29,95,191,.25)}
button.hb:hover{filter:none;transform:translateY(-1px);box-shadow:0 10px 22px rgba(29,95,191,.3)}
button.hb.alt{background:linear-gradient(135deg,#2B8F88,#47B4AB);color:#fff;margin-bottom:3px;box-shadow:0 4px 10px rgba(43,143,136,.25)}
#home{text-align:center;position:relative;overflow:hidden;border-radius:24px;box-shadow:0 18px 48px rgba(60,64,110,.13)}
#home::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#1D5FBF,#38BDF8,#60A5FA)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row>input{flex:1;min-width:130px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--soft);color:var(--mu);font-weight:600;font-size:13px}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(29,95,191,.045)}
.cls{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:border-color .15s,box-shadow .15s}
.cls:hover{border-color:var(--pr2);box-shadow:var(--sh)}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.er{color:var(--er)}
p.mu{margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:9px 18px}
.login{max-width:380px;margin:10vh auto;padding:26px 22px}
.login.card{border-radius:22px}
.login h2{text-align:center;font-size:21px}
.login input{width:100%;margin-bottom:12px}
button.ml{display:block;margin:8px auto 0;padding:4px 8px;background:transparent;color:var(--mu);border:0;box-shadow:none;font-size:13px;font-weight:400;opacity:.12;transition:opacity .2s}
button.ml:hover,button.ml:focus-visible{opacity:.7;filter:none}
.syl{text-align:center;font-size:13px;color:var(--mu);cursor:pointer;margin:-6px 0 8px}
.pub{margin:10px auto 0;padding:10px 14px 12px;border-radius:16px;text-align:center;max-width:460px;background:#FFFFFF;border:1px solid #D6E4F7;box-shadow:0 2px 10px rgba(29,95,191,.08)}
.pub-t{font-size:13px;font-weight:700;letter-spacing:.02em;color:#1D5FBF}
.pub-n{margin-top:2px;font-size:17px;font-weight:800;letter-spacing:.02em;color:#2A2F45}
.pub-d{margin:5px 0 8px;padding-bottom:8px;border-bottom:1px solid #E3EDFA;font-size:14px;line-height:1.35;color:#2A2F45}
.pub-w{display:inline-block;padding:6px 14px;border-radius:999px;background:#0e9f6e;color:#fff;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.pub-w:hover{filter:brightness(1.08)}
.mlw{display:table;margin:8px auto 0;position:relative;padding-bottom:7px}
.mlw button.ml{margin:0}
.mlw::before,.mlw::after{content:"";position:absolute;height:2px;border-radius:2px;background:#6f6a63;opacity:.75}
.mlw::before{left:6%;right:10%;bottom:4px;transform:rotate(-1.2deg)}
.mlw::after{left:16%;right:2%;bottom:0;height:1.5px;transform:rotate(.8deg);opacity:.6}
/* Couleurs des boutons dans les comptes : valeurs FIXES, identiques sur téléphone, tablette et ordinateur */
body.acct button,body.acct .btn{--c:#2563EB;--cd:#1E3A8A;background:var(--c);color:#fff;border:1.5px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.2);-webkit-tap-highlight-color:transparent}
body.acct button:hover,body.acct .btn:hover{filter:brightness(.92)}
body.acct button:active,body.acct .btn:active{background:var(--cd);border-color:var(--cd);transform:scale(.97);filter:none}
body.acct button.on,body.acct button.ab.on{background:var(--cd);border-color:var(--cd);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
body.acct button:disabled{opacity:.5}
body.acct button.s,body.acct .btn.s{--c:#0369A1;--cd:#0C4A6E}
body.acct button.d{--c:#DC2626;--cd:#991B1B}
body.acct button.wa{--c:#16A34A;--cd:#166534}
body.acct button.sm{--c:#DB2777;--cd:#9D174D}
body.acct button.am{--c:#EA580C;--cd:#9A3412}
body.acct button.as{--c:#7C3AED;--cd:#4C1D95}
body.acct button.ar{--c:#0D9488;--cd:#115E59}
body.acct button.mg{--c:#4F46E5;--cd:#3730A3}
body.acct button.mld{--c:#CA8A04;--cd:#854D0E}
body.acct button.prm{--c:#0891B2;--cd:#155E75}
.mlist{height:50vh;min-height:220px;overflow-y:auto;border:1.5px solid var(--bd);border-radius:14px;padding:10px;background:var(--bg)}
.mrow{display:flex;margin-bottom:8px}.mrow.me{justify-content:flex-end}
.mbub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#E5E7EB;color:#1F2937;word-break:break-word;font-size:15px}
.mrow.me .mbub{background:#2563EB;color:#fff;border-radius:14px 14px 4px 14px}
.mnm{font-size:13px;opacity:.75;margin-bottom:2px}
.mx{padding:0 6px!important;font-size:13px!important;margin-left:6px;box-shadow:none!important}
.mbd{background:#DC2626;color:#fff;border-radius:999px;font-size:13px;padding:0 6px;margin-left:4px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.bc button{padding:6px 11px;font-size:13px;border-radius:10px}
.bc .bk{background:var(--pr);color:var(--onpr);border:0}
.bc .sep{color:var(--mu);font-size:14px}
.bc .cur{font-size:13px;font-weight:700;color:var(--tx);padding:6px 4px}
.login .bc{justify-content:center}
/* ===== Adaptation à tous les écrans (téléphone, tablette, ordinateur) ===== */

<style id="tableaux-canva">
/* Tableaux au style Canva : en-tête coloré, lignes alternées, coins arrondis, ombre douce */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#FFFFFF;border:1px solid #D6E4F7;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(29,95,191,.08)}
.wrap,.tbl-scroll,.va-sc{border-radius:14px}
th,td{padding:11px 14px;border-bottom:1px solid #E3EDFA;color:#2A2F45;text-align:left;vertical-align:middle;white-space:nowrap}
th{background:linear-gradient(90deg,#1D5FBF,#0EA5E9);color:#FFFFFF;font-weight:700;font-size:13px;letter-spacing:.2px;border-bottom:0;border-radius:0}
tr:nth-child(even) td{background:#F5F9FF}
tr:hover td{background:#EAF2FF}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
#va-ov table{border-collapse:separate!important;border-spacing:0!important;border:1px solid #D6E4F7;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(29,95,191,.08)}
#va-ov .va-sc{border:1px solid #D6E4F7;box-shadow:0 2px 10px rgba(29,95,191,.08);background:#FFFFFF}
#va-ov th,#va-ov td{padding:10px 13px;border-bottom:1px solid #E3EDFA;color:#2A2F45;white-space:nowrap}
#va-ov th{background:linear-gradient(90deg,#1D5FBF,#0EA5E9);color:#FFFFFF;font-weight:700;font-size:13px;border-bottom:0}
#va-ov tr:nth-child(even) td{background:#F5F9FF}
#va-ov tr:last-child td{border-bottom:0}
.va-pdfb{margin:8px 0 18px;text-align:right}
.va-pdfb button{padding:8px 16px;font-size:13px}
</style>
<style id="icones-ordinateur">
/* Version ordinateur : icônes du menu plus grandes et mises en valeur */
@media (min-width:1025px){
  .hside nav button.hb i{font-size:40px;flex:0 0 60px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.2);box-shadow:0 3px 8px rgba(0,0,0,.18)}
  .hside nav button.hb:hover i,.hside nav button.hb:focus-visible i,.hside nav button.hb:active i{background:rgba(0,113,176,.12);box-shadow:0 3px 8px rgba(0,0,0,.08)}
}
</style>
<style id="fond-defilant">
/* Fond décoratif qui défile lentement (esthétique uniquement, sans effet sur l'usage) */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle,rgba(29,95,191,.16) 1.6px,transparent 2px),radial-gradient(circle,rgba(14,165,233,.14) 1.6px,transparent 2px);
  background-size:36px 36px,36px 36px;background-position:0 0,18px 18px;
  animation:fondDefile 48s linear infinite}
@keyframes fondDefile{to{background-position:360px 360px,378px 378px}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
</style>
<style id="accueil-canva">
/* Page d'accueil au style Canva : fond clair, panneau dégradé, titre fort, pastilles */
#home.hgrid{background:linear-gradient(135deg,#FFFFFF 0%,#EEF5FF 55%,#E6F4FF 100%)!important;border:1px solid #D6E4F7;box-shadow:0 22px 56px rgba(74,63,196,.16)}
#home .hside{background:linear-gradient(165deg,#1E3A8A 0%,#1D5FBF 45%,#0284C7 100%)!important;box-shadow:inset -1px 0 0 rgba(255,255,255,.12)}
#home .hbrand{padding:26px 22px 20px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:8px}
#home .hbrand b{font-size:26px;font-weight:900;letter-spacing:.3px}
#home .hbrand small{font-size:14px;opacity:.9;font-weight:500}
#home .hmain{padding:34px 30px 26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
#home .htitle{font-size:34px;font-weight:900;letter-spacing:.5px;line-height:1.1;background:linear-gradient(90deg,#1E3A8A,#0284C7);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
#home .hsub{display:inline-block;margin:10px 0 0;padding:8px 18px;border-radius:999px;background:#FFFFFF;border:1px solid #D6E4F7;color:#1E3A8A;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(29,95,191,.1)}
#home .hlead{margin:6px 0 16px;font-size:15px;color:#656C86;font-weight:500}
#home .hmain .pub{margin-top:14px;flex-shrink:0;width:100%;max-width:460px}
#home .hside nav button.hb i{background:rgba(255,255,255,.22)}
</style>
<style id="icones-comptes">
/* Icônes des comptes : traits blancs, sans couleurs d'emoji */
#home .hside nav button.hb i svg{width:28px;height:28px;display:block;color:#FFFFFF}
</style>
<style id="accueil-espace">
/* Remplir l'espace sous le panneau bleu avec les fonctions du logiciel */
#home .hfeat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:460px;margin-top:16px}
#home .hfc{background:#FFFFFF;border:1px solid #D6E4F7;border-radius:16px;padding:14px 14px 13px;box-shadow:0 2px 10px rgba(29,95,191,.07);text-align:left;display:flex;flex-direction:column;gap:3px}
#home .hfi{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1D5FBF,#0EA5E9);color:#FFFFFF;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
#home .hfi svg{width:20px;height:20px}
#home .hfc b{font-size:14px;color:#2A2F45;font-weight:800}
#home .hfc small{font-size:12.5px;color:#656C86;line-height:1.35}
@media (max-width:640px){#home .hfeat{grid-template-columns:1fr}}
</style>
<style id="texte-pro">
/* Mise en forme professionnelle des textes sous le panneau bleu : espaces entre les mots et les lettres, interligne aéré */
#home .hmain .hfc b{display:block;font-size:14.5px;font-weight:700;letter-spacing:.15px;word-spacing:.08em;line-height:1.35;margin-bottom:3px}
#home .hmain .hfc small{display:block;font-size:13px;letter-spacing:.1px;word-spacing:.12em;line-height:1.55;color:#5B6280}
#home .hmain .pub{letter-spacing:.1px;word-spacing:.08em}
#home .hmain .pub-d{line-height:1.6;word-spacing:.1em}
#home .hmain .pub-t{letter-spacing:.4px}
#home .hmain .pub-n{letter-spacing:.3px}
</style>
<style id="whatsapp-net">
/* Numéro WhatsApp du constructeur : mots et chiffres bien ordonnés sur une seule ligne */
#home .hmain a.pub-w{display:inline-block;white-space:nowrap;word-spacing:normal;letter-spacing:0;overflow-wrap:normal;word-break:normal;line-height:1.3;font-size:14px;padding:8px 16px;font-variant-numeric:tabular-nums}
</style>
<style id="navigation-grand">
/* Boutons de navigation plus grands : Accueil, Recherche, Retour */
body .bc button{font-size:17px!important;font-weight:700;padding:9px 16px!important;border-radius:12px;line-height:1.25}
body .bc .cur{font-size:17px!important;font-weight:800;padding:9px 6px}
body .retour-auto button{font-size:17px!important;font-weight:700;padding:10px 18px!important;border-radius:12px}
@media (max-width:640px){body .bc button{font-size:16px!important;padding:8px 13px!important}body .bc .cur{font-size:16px!important}body .retour-auto button{font-size:16px!important}}
</style>
<style id="home-lisibilite">
/* Menu d'accueil : chaque libellé s'écrit dans son bouton, sur autant de lignes qu'il faut, sans chevaucher le suivant */
.hside nav{height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important;display:flex!important;flex-direction:column!important;gap:6px!important}
.hside nav button.hb{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;height:auto!important;min-height:0!important;max-height:none!important;width:100%!important;padding:12px 12px!important;line-height:1.3!important;white-space:normal!important;word-break:normal!important;overflow-wrap:break-word!important;overflow:visible!important;position:relative!important;transform:none!important;letter-spacing:normal!important;word-spacing:normal!important}
.hside nav button.hb i{flex:0 0 auto!important;height:auto!important;width:auto!important;line-height:1!important;position:static!important}
#home .hmain *:not(.htitle){letter-spacing:normal!important;word-spacing:normal!important}
#home .hmain .hfc b,#home .hmain .hfc small,#home .hmain .pub-d,#home .hmain .pub-t,#home .hmain .pub-n,.hsub{line-height:1.45!important}
.hbrand b,.hbrand small{line-height:1.3!important}
/* Image au-dessus de CEG1 ALLADA : centrée, 4,5 cm de large et 2 cm de haut */
#home .hbrand img.logo-home,html.big-screen #home .hbrand img.logo-home{display:block!important;align-self:center!important;width:4.5cm!important;height:2cm!important;object-fit:cover!important;max-width:none!important;min-width:0!important;min-height:0!important;margin:0 auto 8px!important;border-radius:12px;background:#fff}
#app:not(.ready){visibility:hidden}
</style>
</head>

<script>
/* Adaptation automatique à la taille de l'écran : agrandissement proportionnel au-delà de 1280 px, aucun rétrécissement sur téléphone/tablette */
(function(){
  var BASE = 1280, MAX = 3, root = document.documentElement;
  function fit(){
    var w = window.innerWidth || root.clientWidth || BASE;
    var s = w > BASE ? Math.min(MAX, w / BASE) : 1;
    s = Math.round(s * 100) / 100;
    root.style.zoom = s > 1 ? String(s) : '';
    root.classList.toggle('big-screen', s > 1);
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

<script>
/* Espace SG : bouton Détails (à côté de Quit), recherche d'élève enrichie */
(function(){
  var kind = null;
  var ov = document.getElementById('sov'), sb = document.getElementById('shB'), st = document.getElementById('shT');
  function appOn(){ return !!me && view.page === 'app'; }
  function curClass(){ return view.cid ? db.classes.find(function(x){ return x.id === view.cid; }) : null; }

  /* Ce qui était affiché en bas de la page est maintenant dans le panneau Détails */
  window.addExtras = function(){
    if (!appOn()) return;
    var m = $('m'); if (!m) return;
    if (me.role !== 'surv' && view.tab === 'eleves') { m.insertAdjacentHTML('beforeend', xDash()); return; }
    if (!view.cid || (me.role !== 'surv' && view.tab !== 'sga')) return;
    var c = curClass(); if (c) m.insertAdjacentHTML('beforeend', xStats(c));
  };

  /* Motif automatique selon les boutons cochés : Mld = Malade, Prm = Permission, AbM/AbS sans autre choix = Sans motif */
  function motifAuto(r){
    if (!r) return 'Non précisé';
    if (r.ml) return 'Malade';
    if (r.pm) return 'Permission';
    if (r.m || r.s) return 'Sans motif';
    return 'Non précisé';
  }
  window.autoMotif = motifAuto;
  /* Motif final d'un jour : le motif saisi à la main prime, sinon le motif automatique */
  function motifFinal(d, sid){
    var r = (db.abs[d] || {})[sid] || {};
    var e = exd(d, sid) || {};
    var auto = { 'Malade': 1, 'Permission': 1, 'Sans motif': 1, 'Non précisé': 1 };
    /* Les boutons cochés priment, y compris sur les jours enregistrés avant cette règle */
    if (r.ml) return 'Malade';
    if (r.pm) return 'Permission';
    /* Un motif saisi à la main (texte libre) est conservé */
    if (e.mo && !auto[e.mo]) return e.mo;
    return motifAuto(r);
  }
  /* Absences d'un élève sur l'année : demi-journées, jours et motifs */
  function absInfo(sid){
    var ab = rapAnPeriode(), a = ab[0], b = ab[1], m = 0, sr = 0, days = 0, mot = {};
    Object.keys(db.abs || {}).filter(function(d){ return d >= a && d <= b; }).forEach(function(d){
      var r = (db.abs[d] || {})[sid]; if (!r || !(r.m || r.s)) return;
      days++; if (r.m) m++; if (r.s) sr++;
      var k = motifFinal(d, sid);

    });

  function infoHtml(s){

    return '<div class="sinfo">' +
      '<div><span class="l">Classe : </span>' + esc(c.name || '?') + ' · ' + esc(pn(c.owner, c.promo || 'A')) + '</div>' +
      '<div><span class="l">SG : </span>' + esc(userName(c.owner)) + '</div>' +
      '<div><span class="l">Téléphone : </span>' + (s.phone ? esc(s.phone) : 'non renseigné') + '</div>' +
      '<div><span class="l">Absents : </span>' + ai.tot + ' demi-journée(s) · ' + ai.days + ' jour(s)</div>' +
      '<div><span class="l">Motifs : </span>' + motifs + '</div>' +
      '</div>';
  }
  /* Résultat de recherche : seulement le nom de la classe et le nombre d'absences (le reste s'ouvre en cliquant sur le nom) */
  function searchInfo(s){
    var c = db.classes.find(function(x){ return x.id === s.cid; }) || {};
    return '<div class="sinfo" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin-top:2px">' +
      '<span><b>' + esc(c.name || '?') + '</b></span>' +
      "<span><span class=\"l\">Nbre d'Abs : </span><b>" + absInfo(s.id).tot + '</b></span>' +
      '</div>';
  }
  function nameLink(s){
    return '<a role="button" tabindex="0" data-stu="' + esc(s.id) + '" style="cursor:pointer;color:var(--pr);font-weight:700;font-size:16px;text-decoration:underline;overflow-wrap:anywhere">' + esc(s.name) + '</a>';
  }
  /* Fiche détaillée d'un élève */
  var stuId = null;
  function stuHtml(sid){
    var s = db.students.find(function(x){ return x.id === sid; });
    if (!s) return '<p class="mu">Élève introuvable.</p>';
    var c = db.classes.find(function(x){ return x.id === s.cid; }) || {};
    var pr = rapAnPeriode(), a = pr[0], b = pr[1], m = 0, sr = 0, rows = [], retards = [];
    Object.keys(db.abs || {}).filter(function(d){ return d >= a && d <= b; }).sort().reverse().forEach(function(d){
      var r = (db.abs[d] || {})[sid]; if (!r || !(r.m || r.s)) return;
      if (r.m) m++; if (r.s) sr++;
      var e = exd(d, sid), mo = motifFinal(d, sid);
      rows.push('<tr><td>' + frD(d) + '</td><td>' + (r.m && r.s ? 'Journée' : r.m ? 'Matin' : 'Soir') + '</td><td>' + esc(mo) + '</td><td>' + esc(e.ob || '') + '</td></tr>');
    });
    Object.keys(ex()).filter(function(d){ return d >= a && d <= b; }).sort().reverse().forEach(function(d){
      if (exd(d, sid).rt) retards.push(frD(d));
    });
    var ph = s.phone ? esc(s.phone) : 'non renseigné';
    return '<div class="sinfo" style="font-size:15px">' +
      '<div><span class="l">Nom complet : </span><b>' + esc(s.name) + '</b></div>' +
      '<div><span class="l">Classe : </span>' + esc(c.name || '?') + ' · ' + esc(pn(c.owner, c.promo || 'A')) + '</div>' +
      '<div><span class="l">SG : </span>' + esc(userName(c.owner)) + '</div>' +
      '<div><span class="l">Téléphone des parents : </span>' + ph + '</div>' +
      '</div>' +
      '<div class="row" style="margin:12px 0"><button class="s sm" onclick="parentMsg(\'' + s.id + '\',\'sms\')">💬 SMS</button> <button class="s wa" onclick="parentMsg(\'' + s.id + '\',\'wa\')">WhatsApp</button></div>' +
      '<div class="card" style="margin:0 0 12px"><h2 style="font-size:16px">Absences · ' + esc(anneeLabel(anneeVue())) + '</h2>' +
      '<p style="margin:0 0 6px"><b>' + (m + sr) + '</b> demi-journée(s) d\'absence · ' + rows.length + ' jour(s) · dont ' + m + ' matin(s) et ' + sr + ' soir(s)</p>' +
      motifsHtml(sid) +
      '<p class="mu" style="margin:0 0 8px">Retards : ' + (retards.length ? retards.length + ' (' + esc(retards.join(', ')) + ')' : 'aucun') + '</p>' +
      (rows.length ? '<div class="wrap"><table><tr><th>Date</th><th>Type</th><th>Motif</th><th>Observation</th></tr>' + rows.join('') + '</table></div>' : '<p class="mu">Aucune absence sur la période.</p>') +
      '<p class="mu" style="margin-top:6px">Période : du ' + dFr(a) + ' au ' + dFr(b) + '</p></div>';
  }
  /* Répartition des absences de l'élève par motif */
  function motifsHtml(sid){
    var ai = absInfo(sid), keys = Object.keys(ai.mot);
    if (!keys.length) return '';
    keys.sort(function(x, y){ return ai.mot[y] - ai.mot[x] || x.localeCompare(y, 'fr'); });
    return '<div class="wrap" style="margin:0 0 10px"><table><tr><th>Motif</th><th>Demi-journées</th><th>Part</th></tr>' +
      keys.map(function(k){
        var pct = ai.tot ? Math.round(ai.mot[k] * 100 / ai.tot) : 0;
        return '<tr><td>' + esc(k) + '</td><td><b>' + ai.mot[k] + '</b></td><td>' + pct + ' %</td></tr>';
      }).join('') + '</table></div>';
  }
  function openStu(sid){ kind = 'stu'; stuId = sid; ov.hidden = false; paintSheet(); sb.scrollTop = 0; }
  document.addEventListener('click', function(e){
    var t = e.target.closest && e.target.closest('[data-stu]'); if (!t) return;
    e.preventDefault(); openStu(t.getAttribute('data-stu'));
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('data-stu')) openStu(e.target.getAttribute('data-stu'));
  });

  /* Un SG ne voit que les élèves de ses propres promotions (ses classes) ; la recherche dans une classe ne montre que cette classe */
  function peutVoir(s){
    var c = db.classes.find(function(x){ return x.id === s.cid; }) || {};
    if (c.annee !== anneeVue()) return false;
    /* Dans une classe ouverte : seulement les élèves de cette classe */
    if (view && view.cid) return s.cid === view.cid;
    /* Dans l'espace d'un SG (ou espace du SG connecté) : seulement ses élèves */
    var sgId = (me && me.role === 'surv') ? me.id : ((view && view.sg) || null);
    if (sgId) return c.owner === sgId;
    /* Directeur, censeur, superviseur hors espace SG : tous les élèves */
    return true;
  }
  window.searchHtml = function(v){
    var q = nz((v || '').trim());
    if (!q) return '';
    view.date = view.date || today();
    var day = db.abs[view.date] || {}, cls = srchCls();
    var l = db.students.filter(function(s){ return nz(s.name).includes(q) && (!cls || s.cid === cls) && peutVoir(s); }).slice(0, 50);
    if (!l.length) return '<p class="mu">Aucun élève trouvé.</p>';
    return '<p class="mu" style="margin:4px 0">Date : ' + esc(view.date) + '</p>' + l.map(function(s){
      var r = day[s.id] || {};
      return '<div class="cls" style="cursor:default;display:block"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap"><div style="min-width:0">' + nameLink(s) + searchInfo(s) + '</div>' +
        '<div><button class="ab am ' + (r.m ? 'on' : '') + '" onclick="toggleAb(\'' + s.id + '\',\'m\')">AbM</button> <button class="ab as ' + (r.s ? 'on' : '') + '" onclick="toggleAb(\'' + s.id + '\',\'s\')">AbS</button> <button class="ab mld ' + (r.ml ? 'on' : '') + '" onclick="toggleAb(\'' + s.id + '\',\'ml\')">Mld</button> <button class="ab prm ' + (r.pm ? 'on' : '') + '" onclick="toggleAb(\'' + s.id + '\',\'pm\')">Prm</button></div></div></div>';
    }).join('');
  };
  /* Recherche de la page « Recherche d'un élève » */
  window.doSearch = function(v){
    var q = nz((v || '').trim()), r = $('sr');
    if (!r) return;
    if (!q) { r.innerHTML = ''; return; }
    var l = db.students.filter(function(s){ return nz(s.name).includes(q) && peutVoir(s); }).slice(0, 50);
    r.innerHTML = l.map(function(s){
      return '<div class="cls" style="cursor:default;display:block">' + nameLink(s) + searchInfo(s) + '</div>';
    }).join('') || '<p class="mu">Aucun élève trouvé.</p>';
  };

  /* Panneau Détails */
  function menuHtml(){
    return '<button class="hb alt mbtn" data-k="det">📝 Détails du jour et Retard</button>' +
           '<button class="hb mbtn" data-k="rap">📅 Rapport annuel des absents par élève</button>';
  }
  function content(){
    var c = curClass();
    if (kind === 'det') {
      st.textContent = '📝 Détails du jour et Retard' + (c ? ' · ' + c.name : '');
      return c ? xTools(c) + xDetails(c) : '<p class="mu">Ouvre d\'abord une classe pour voir les détails du jour et les retards.</p>';
    }
    st.textContent = '📅 Rapport annuel des absents par élève';
    return c ? rapAnCard('c:' + c.id, 'Classe : ' + c.name) : rapAnCard('f', 'Élèves selon les filtres choisis');
  }
  function paintSheet(){
    if (!ov || ov.hidden) return;
    if (kind === 'tr') {
      if (!isM()) { closeSheet(); return; }
      st.textContent = '🔀 Transfert promotion / classe';
      sb.innerHTML = trForm(); window.trRefresh(); return;
    }
    if (kind === 'stu') {
      var sx = sb.scrollTop, sd = db.students.find(function(x){ return x.id === stuId; });
      st.textContent = '👤 ' + (sd ? sd.name : 'Élève');
      sb.innerHTML = '<button class="s" data-back="1" style="margin-bottom:10px">← Retour</button>' + stuHtml(stuId);
      sb.scrollTop = sx; return;
    }
    if (!appOn()) { closeSheet(); return; }
    var y = sb.scrollTop;
    if (!kind) { st.textContent = '🔎 Détails'; sb.innerHTML = menuHtml(); }
    else sb.innerHTML = '<button class="s" data-back="1" style="margin-bottom:10px">← Retour</button>' + content();
    sb.scrollTop = y;
  }
  function openSheet(){ kind = null; ov.hidden = false; paintSheet(); sb.scrollTop = 0; }
  function closeSheet(){ kind = null; if (ov) ov.hidden = true; if (sb) sb.innerHTML = ''; }
  window.openDet = openSheet;
  sb.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-k],[data-back]'); if (!b) return;
    if (b.hasAttribute('data-back')) { if (kind === 'stu') { closeSheet(); return; } kind = null; }
    else kind = b.getAttribute('data-k');
    paintSheet(); sb.scrollTop = 0;
  });
  document.getElementById('shX').onclick = closeSheet;
  ov.addEventListener('click', function(e){ if (e.target === ov) closeSheet(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !ov.hidden) closeSheet(); });

  /* ===== MasterLog : transfert d'une promotion ou d'une classe vers un autre SG ===== */
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function trPromoName(src, k){ return (src.promos || {})[k] || 'Promo ' + k; }
  /* Donne à la promotion une clé libre chez le SG de destination (même nom = même clé si possible) */
  function trKeyFor(dst, name, pref){
    dst.promos = dst.promos || {};
    if (!dst.promos[pref]) { dst.promos[pref] = name; return pref; }
    if (dst.promos[pref] === name) return pref;
    var same = Object.keys(dst.promos).find(function(x){ return dst.promos[x] === name; });
    if (same) return same;
    var free = LETTERS.split('').find(function(x){ return !dst.promos[x]; }) || pref;
    dst.promos[free] = name; return free;
  }
  function trPromoKeys(src){
    var ks = Object.keys(src.promos || {});
    db.classes.forEach(function(c){ if (c.owner === src.id && ks.indexOf(c.promo || 'A') < 0) ks.push(c.promo || 'A'); });
    return ks.filter(function(k){ return db.classes.some(function(c){ return c.owner === src.id && (c.promo || 'A') === k; }); });
  }
  function trPromo(src, dst, k){
    var name = trPromoName(src, k), nk = trKeyFor(dst, name, k), n = 0;
    db.classes.forEach(function(c){
      if (c.owner === src.id && (c.promo || 'A') === k) { c.owner = dst.id; c.promo = nk; n++; }
    });
    if (src.promos) delete src.promos[k];
    return n;
  }
  function trClass(src, dst, cid){
    var c = db.classes.find(function(x){ return x.id === cid; });
    if (!c || c.owner !== src.id) return 0;
    var k = c.promo || 'A';
    c.promo = trKeyFor(dst, trPromoName(src, k), k);
    c.owner = dst.id;
    return 1;
  }
  function trForm(){
    var sgs = db.users.filter(function(u){ return u.role === 'surv'; });
    return '<div class="card" style="margin:0">' +
      '<p class="mu">Déplace une promotion (avec toutes ses classes) ou une classe d\'un SG vers un autre. Les élèves et les absents cochés suivent.</p>' +
      '<p style="margin:8px 0 4px"><b>1. SG d\'origine</b></p>' +
      '<select id="trS" onchange="trRefresh()" style="width:100%">' + sgs.map(function(u){ return '<option value="' + u.id + '">' + esc(u.name) + '</option>'; }).join('') + '</select>' +
      '<p style="margin:8px 0 4px"><b>2. Type</b></p>' +
      '<select id="trT" onchange="trRefresh()" style="width:100%"><option value="promo">Une promotion (avec toutes ses classes)</option><option value="class">Une classe</option><option value="student">Un élève (vers une autre classe)</option></select>' +
      '<p style="margin:8px 0 4px"><b>3. Élément à transférer</b></p>' +
      '<select id="trE" style="width:100%"></select>' +
      '<p style="margin:8px 0 4px"><b>4. Destination (SG ou classe)</b></p>' +
      '<select id="trD" style="width:100%"></select>' +
      '<div class="row" style="margin-top:12px"><button onclick="trGo()">🔀 Transférer</button></div></div>';
  }
  var classeNom = function(c){ return c ? c.name + ' · ' + c.annee + ' · ' + userName(c.owner) : '?'; };
  window.trRefresh = function(){
    var S = $('trS'), T = $('trT'), E = $('trE'), D = $('trD');
    if (!S || !T || !E || !D) return;
    var src = db.users.find(function(u){ return u.id === S.value; });
    if (!src) return;
    if (T.value === 'promo') {
      E.innerHTML = trPromoKeys(src).map(function(k){
        var n = db.classes.filter(function(c){ return c.owner === src.id && (c.promo || 'A') === k; }).length;
        return '<option value="' + esc(k) + '">' + esc(trPromoName(src, k)) + ' (' + n + ' classe(s))</option>';
      }).join('') || '<option value="">Aucune promotion</option>';
      D.innerHTML = db.users.filter(function(u){ return u.role === 'surv' && u.id !== src.id; }).map(function(u){
        return '<option value="' + u.id + '">' + esc(u.name) + '</option>';
      }).join('');
    } else if (T.value === 'class') {
      E.innerHTML = db.classes.filter(function(c){ return c.owner === src.id; }).map(function(c){
        return '<option value="' + c.id + '">' + esc(c.name) + ' · ' + esc(c.annee) + ' · ' + esc(trPromoName(src, c.promo || 'A')) + '</option>';
      }).join('') || '<option value="">Aucune classe</option>';
      D.innerHTML = db.users.filter(function(u){ return u.role === 'surv' && u.id !== src.id; }).map(function(u){
        return '<option value="' + u.id + '">' + esc(u.name) + '</option>';
      }).join('');
    } else {
      var mine = db.classes.filter(function(c){ return c.owner === src.id; }).map(function(c){ return c.id; });
      E.innerHTML = db.students.filter(function(s){ return mine.indexOf(s.cid) >= 0; }).map(function(s){
        var c = db.classes.find(function(x){ return x.id === s.cid; });
        return '<option value="' + s.id + '">' + esc(s.name) + ' · ' + esc(c ? c.name + ' (' + c.annee + ')' : '?') + '</option>';
      }).join('') || '<option value="">Aucun élève</option>';
      D.innerHTML = db.classes.filter(function(c){ return c.annee === anneeVue(); }).map(function(c){
        return '<option value="' + c.id + '">' + esc(classeNom(c)) + '</option>';
      }).join('') || '<option value="">Aucune classe</option>';
    }
  };
  window.trGo = function(){
    var S = $('trS'), T = $('trT'), E = $('trE'), D = $('trD');
    var src = db.users.find(function(u){ return u.id === S.value; });
    if (!src || !E.value || !D.value) return alert('Choisis l\'élément et la destination.');
    if (T.value === 'student') {
      var stu = db.students.find(function(x){ return x.id === E.value; });
      var dc = db.classes.find(function(c){ return c.id === D.value; });
      if (!stu || !dc) return alert('Élève ou classe introuvable.');
      if (stu.cid === dc.id) return alert('L\'élève est déjà dans cette classe.');
      if (!confirm('Transférer l\'élève « ' + stu.name + ' » vers la classe « ' + classeNom(dc) + ' » ?\nSes absences cochées le suivent.')) return;
      stu.cid = dc.id;
      save(); closeSheet(); render();
      alert('Élève transféré vers ' + dc.name + '.');
      return;
    }
    var dst = db.users.find(function(u){ return u.id === D.value; });
    if (!dst) return alert('Choisis le SG de destination.');
    if (src.id === dst.id) return alert('Le SG de destination doit être différent du SG d\'origine.');
    var what = T.value === 'promo' ? 'la promotion « ' + trPromoName(src, E.value) + ' » (toutes ses classes)' :
      'la classe « ' + ((db.classes.find(function(c){ return c.id === E.value; }) || {}).name || '?') + ' »';
    if (!confirm('Transférer ' + what + ' de ' + src.name + ' vers ' + dst.name + ' ?\nLes élèves et les absents cochés suivent.')) return;
    var n = T.value === 'promo' ? trPromo(src, dst, E.value) : trClass(src, dst, E.value);
    save(); closeSheet(); render();
    alert('Transfert effectué : ' + n + ' classe(s) déplacée(s) vers ' + dst.name + '.');
  };
  window.openTr = function(){ if (!isM()) return; kind = 'tr'; ov.hidden = false; paintSheet(); sb.scrollTop = 0; };

  /* Barre d'en-tête : « Quit » à la place de « Déconnexion », « Détails » juste à côté */
  function fixHeader(){
    document.querySelectorAll('header button').forEach(function(b){
      if (b.getAttribute('onclick') !== 'logout()') return;
      b.textContent = 'Quit'; b.title = 'Quitter (déconnexion)';
      if (appOn() && isM() && !b.parentNode.querySelector('#btr')) {
        var t = document.createElement('button');
        t.id = 'btr'; t.className = 's'; t.textContent = '🔀 Transférer';
        t.setAttribute('onclick', 'openTr()');
        b.parentNode.insertBefore(t, b);
      }
      if (appOn() && !b.parentNode.querySelector('#bdet')) {
        var d = document.createElement('button');
        d.id = 'bdet'; d.className = 's'; d.textContent = '📋 Détails';
        d.setAttribute('onclick', 'openDet()');
        b.parentNode.insertBefore(d, b);
      }
    });
  }
  var prevRender = window.render;
  window.render = function(){ prevRender.apply(this, arguments); fixHeader(); paintSheet(); };
  fixHeader();
})();

<script>
/* Annulation de la mise à jour précédente : « SG HESSOU » redevient « SG A DÉFINIR 1 » et la promotion Tle retourne à « SG AMIKPÉMI »
   (avec ses classes, ses élèves et les absents cochés). Exécuté une seule fois. */
(function(){
  if (!db || !db.hessouV1 || db.hessouUndo) return;
  var src = db.users.find(function(u){ return u.name === 'SG AMIKPÉMI'; });
  var dst = db.users.find(function(u){ return u.name === 'SG HESSOU'; });
  if (!src || !dst) return;
  dst.name = 'SG A DÉFINIR 1';
  var k = Object.keys(dst.promos || {}).find(function(key){ return String(dst.promos[key]).trim().toLowerCase() === 'tle'; });
  if (k) {
    src.promos = src.promos || {};
    var nk = !src.promos[k] ? k : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(function(x){ return !src.promos[x]; });
    src.promos[nk] = 'Tle';
    db.classes.forEach(function(c){
      if (c.owner === dst.id && (c.promo || 'A') === k) { c.owner = src.id; c.promo = nk; }
    });
    delete dst.promos[k];
  }
  db.hessouV1 = 0;
  db.hessouUndo = 1;
  save();
  if (typeof render === 'function') render();
})();
</script>
<script>
/* Ouverture rapide de l'espace après le code : la vérification de session ne bloque plus l'entrée (délai maximum 0,8 s) */
(function(){
  var TIMEOUT = 800, MAX_APPAREILS = 12;
  window.claimSession = function(u){
    if (!syOn()) return Promise.resolve(true);
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, TIMEOUT);
    var opt = { cache: 'no-store' };
    if (ctl) opt.signal = ctl.signal;
    return fetch(pUrl(u.id) + '.json', opt).then(function(r){
      if (!r.ok) return true;
      return r.json().then(function(o){
        o = o || {};
        var n = syT();
        var act = Object.keys(o).filter(function(k){ return k !== SID && o[k] && typeof o[k].t === 'number' && n - o[k].t < SESS_TTL; }).length;
        if (act >= MAX_APPAREILS) {
          alert('Ce compte est déjà utilisé sur ' + MAX_APPAREILS + ' appareils en même temps. Déconnecte-toi sur l\'un d\'eux (ou attends 2 minutes après sa fermeture), puis réessaie.');
          return false;
        }
        fetch(pUrl(u.id) + SID + '.json', { method: 'PUT', body: JSON.stringify({ t: n }) }).catch(function(){});
        return true;
      });
    }).catch(function(){ return true; })
      .finally(function(){ clearTimeout(timer); });
  };
  /* Sauvegarde locale immédiate ; la synchronisation part en arrière-plan, plus vite qu'avant */
  window.syAfterSave = function(){
    if (!syOn()) return;
    if (syDiff()) sySave();
    clearTimeout(syTm);
    syTm = setTimeout(syRun, 300);
  };
})();
</script>
<script>
/* Appareils connectés : compteur dans l'en-tête de chaque espace, et panneau MasterLog qui voit tous les comptes */
(function(){
  var DEV_MAX = 12;
  function fmt(x){ return x < 60 ? x + ' s' : Math.round(x / 60) + ' min'; }
  function ensureHeader(){
    if (!me) return;

    document.head.appendChild(st);

  function ensurePanel(){

    var o = document.createElement('div');
    o.id = 'devov'; o.hidden = true;
    o.innerHTML = '<div id="devsh" role="dialog" aria-modal="true"><div class="dh"><b>📱 Appareils connectés</b><span><button class="s" id="devr">↻ Actualiser</button> <button class="s" id="devx">✕ Fermer</button></span></div><div class="db" id="devb"></div></div>';
    document.body.appendChild(o);
    o.addEventListener('click', function(e){ if (e.target === o) closeMaster(); });
    o.querySelector('#devx').onclick = closeMaster;
    o.querySelector('#devr').onclick = paintMaster;
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !o.hidden) closeMaster(); });
    pv = o; return o;

  function openMaster(){ if (!isM()) return; ensurePanel().hidden = false; paintMaster(); }
  function closeMaster(){ if (pv) pv.hidden = true; }
  function paintMaster(){
    if (!pv || pv.hidden) return;
    var body = pv.querySelector('#devb');
    if (!syOn()) { body.innerHTML = '<p class="mu">La synchronisation n\'est pas activée : le nombre d\'appareils n\'est pas disponible.</p>'; return; }
    body.innerHTML = '<p class="mu">Chargement…</p>';
    var users = db.users.filter(function(u){ return u.role !== 'master'; });
    Promise.all(users.map(function(u){
      return fetch(pUrl(u.id) + '.json', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ return { u: u, o: d }; }).catch(function(){ return { u: u, o: null }; });
    })).then(function(rows){
      var n = syT();
      body.innerHTML = '<p class="mu" style="margin:0 0 10px">Mis à jour à ' + new Date().toLocaleTimeString('fr-FR') + '</p>' + rows.map(function(r){
        if (!r.o && r.o !== null) return '';
        if (!r.o) return '<div class="cls" style="cursor:default;display:block"><b>' + esc(r.u.name) + '</b> <span class="mu">indisponible</span></div>';
        var act = Object.keys(r.o).filter(function(k){ return r.o[k] && typeof r.o[k].t === 'number' && n - r.o[k].t < SESS_TTL; })
          .map(function(k){ return Math.round((n - r.o[k].t) / 1000); }).sort(function(a, b){ return a - b; });
        return '<div class="cls" style="cursor:default;display:block"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>' + esc(r.u.name) + '</b><span><b>' + act.length + '</b>/' + DEV_MAX + ' appareil(s)</span></div>' +
          (act.length ? '<div class="mu" style="margin-top:4px">' + act.map(function(x, i){ return 'Appareil ' + (i + 1) + ' : actif il y a ' + fmt(x); }).join(' · ') + '</div>' : '<div class="mu">Aucun appareil connecté</div>') + '</div>';
      }).join('');
    });
  }

  var prev = window.render;
  window.render = function(){
    prev.apply(this, arguments);
    ensureHeader();
    refreshDev();

<script>
/* Alertes de doublons : classe déjà existante (ajout de classe) et nom d'élève déjà existant (ajout ou import d'élèves) */
(function(){
  var norm = function(t){ return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); };
  var nomExiste = function(cid, nom){ return db.students.some(function(s){ return s.cid === cid && norm(s.name) === norm(nom); }); };
  var listeNoms = function(a){ return a.slice(0, 20).map(function(x){ return '- ' + x; }).join('\n') + (a.length > 20 ? '\n…' : ''); };

  /* Ajout de classe */
  var origClasse = window.addClass;
  window.addClass = function(){
    var el = $('cn'), n = el ? el.value.trim() : '';
    if (n && db.classes.some(function(c){ return c.owner === ow() && c.annee === anneeVue() && norm(c.name) === norm(n); })) {
      alert('La classe « ' + n + ' » existe déjà dans cet espace SG pour l\'année ' + anneeLabel(anneeVue()) + '.');
      return;
    }
    return origClasse.apply(this, arguments);
  };

  /* Ajout d'un élève */
  var origAjout = window.addStu;
  window.addStu = function(){
    var nom = (($('n') || {}).value || '').trim() + ' ' + (($('pn') || {}).value || '').trim();
    if (nom.trim() && nomExiste(view.cid, nom)) {
      alert('Un élève nommé « ' + nom.trim().replace(/\s+/g, ' ') + ' » existe déjà dans cette classe.');
      return;
    }
    return origAjout.apply(this, arguments);
  };

  /* Import d'élèves : alerte dès le chargement du fichier, puis confirmation avant d'importer */
  var doublonsImport = function(){
    if (typeof pending === 'undefined' || !pending) return [];
    return pending.filter(function(p){ return !p.x.err && nomExiste(view.cid, p.x.name); }).map(function(p){ return p.x.name; });
  };
  var origImport = window.importFile;
  window.importFile = async function(f){
    await origImport.call(this, f);
    var d = doublonsImport();
    if (d.length) alert('Attention : ' + d.length + ' élève(s) existent déjà dans cette classe :\n' + listeNoms(d) + '\n\nLe fichier reste affiché : tu peux décider de l\'importer ou non.');
  };
  var origConfirm = window.confirmImp;
  window.confirmImp = function(){
    var d = doublonsImport();
    if (d.length && !confirm('Attention : ' + d.length + ' élève(s) existent déjà dans cette classe :\n' + listeNoms(d) + '\n\nImporter quand même ?')) return;
    return origConfirm.apply(this, arguments);
  };
})();
</script>
<script>
/* MasterLog : alerte et bandeau qui signalent les doublons de nom d'élève dans toute l'application (année en cours) */
(function(){
  var norm = function(t){ return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); };
  var lastSig = null;
  function groupes(){
    var an = anneeVue(), g = {};
    db.students.forEach(function(s){
      var c = db.classes.find(function(x){ return x.id === s.cid; });
      if (!c || c.annee !== an) return;
      var k = norm(s.name);
      (g[k] = g[k] || []).push({ s: s, c: c });
    });
    return Object.keys(g).filter(function(k){ return g[k].length > 1; }).map(function(k){ return g[k]; });
  }
  function ligne(e){
    return esc(e.s.name) + ' — ' + esc(e.c.name) + ' (' + esc(userName(e.c.owner)) + ')' + (e.s.phone ? ' · ' + esc(e.s.phone) : '') +
      ' <button class="s" style="margin-left:6px;padding:3px 9px;font-size:13px" onclick="garderDup(\'' + e.s.id + '\')">✅ Garder ce nom</button>' +
      ' <button class="d" style="margin-left:4px;padding:3px 9px;font-size:13px" onclick="delDup(\'' + e.s.id + '\')">🗑 Supprimer</button>';
  }
  /* Suppression simple d'un doublon (élève et ses absences) */
  window.delDup = function(id){
    if (!isM()) return;
    var s = db.students.find(function(x){ return x.id === id; });
    if (!s) return;
    var c = db.classes.find(function(x){ return x.id === s.cid; }) || {};
    var nAbs = Object.keys(db.abs || {}).filter(function(d){ return !!(db.abs[d] || {})[id]; }).length;
    if (!confirm('Supprimer le doublon « ' + s.name + ' » (' + (c.name || '?') + ' · ' + userName(c.owner) + ') ?\nSes ' + nAbs + ' jour(s) d\'absence enregistré(s) seront aussi supprimés.')) return;
    purgeStu([id]);
    save();
    render();
  };
  function ensureBanner(){
    var old = document.getElementById('dupban');
    if (old) old.remove();
    if (!me || !isM() || view.page !== 'app') return;
    var h = document.querySelector('#app header');
    if (!h) return;
    var gs = groupes();
    if (!gs.length) return;
    var b = document.createElement('div');
    b.id = 'dupban';
    b.style.cssText = 'max-width:1000px;margin:8px auto 0;padding:8px 12px;background:#FEF2F2;border:1.5px solid #FCA5A5;color:#991B1B;border-radius:12px;font-size:14px';
    b.innerHTML = '<details><summary style="cursor:pointer;font-weight:700">⚠️ ' + gs.length + ' doublon(s) de nom d\'élève dans l\'application (année ' + esc(anneeLabel(anneeVue())) + ') — voir la liste</summary>' +
      '<ul style="margin:6px 0 0 18px;padding:0">' + gs.map(function(g){
        return '<li style="margin:4px 0"><b>' + esc(g[0].s.name) + '</b> (' + g.length + ')<ul style="margin:2px 0 0 16px;padding:0">' + g.map(function(e){ return '<li>' + ligne(e) + '</li>'; }).join('') + '</ul></li>';
      }).join('') + '</ul></details>';
    h.insertAdjacentElement('afterend', b);
    var sig = gs.map(function(g){ return norm(g[0].s.name); }).sort().join('|');
    if (sig !== lastSig) {
      lastSig = sig;
      alert('Attention : ' + gs.length + ' nom(s) d\'élève en doublon dans l\'application :\n' +
        gs.slice(0, 15).map(function(g){ return '- ' + g[0].s.name + ' (' + g.length + ' fois : ' + g.map(function(e){ return e.c.name; }).join(', ') + ')'; }).join('\n') +
        (gs.length > 15 ? '\n…' : '') + '\n\nVérifie s\'il s\'agit de vrais doublons.');
    }
  }
  /* Fusion : on garde le nom choisi ; il reçoit les absences du doublon qui en a le plus (demi-journées) */
  function totalAbs(id){
    var n = 0;
    Object.keys(db.abs || {}).forEach(function(d){ var r = (db.abs[d] || {})[id]; if (r) n += (r.m ? 1 : 0) + (r.s ? 1 : 0); });
    return n;
  }
  window.garderDup = function(id){
    if (!isM()) return;
    var grp = groupes().find(function(g){ return g.some(function(e){ return e.s.id === id; }); });
    if (!grp) return;
    var keep = grp.find(function(e){ return e.s.id === id; }).s;
    var stats = grp.map(function(e){ return { s: e.s, c: e.c, n: totalAbs(e.s.id) }; });
    var best = stats.slice().sort(function(a, b){ return b.n - a.n; })[0];
    var liste = stats.map(function(x){ return '- ' + x.s.name + ' (' + (x.c.name || '?') + ' · ' + userName(x.c.owner) + ') : ' + x.n + ' demi-journée(s)' + (x.s.id === keep.id ? ' [à garder]' : ''); }).join('\n');
    if (!confirm('Garder « ' + keep.name + ' » et supprimer les autres doublons ?\n\n' + liste + '\n\n« ' + keep.name + ' » recevra les absences de « ' + best.s.name + ' » (' + best.n + ' demi-journée(s), le plus grand nombre). Cette action est définitive.')) return;
    var bestId = best.s.id;
    if (bestId !== keep.id) {
      Object.keys(db.abs || {}).forEach(function(d){
        var day = db.abs[d] || {};
        if (day[bestId]) day[keep.id] = Object.assign({}, day[bestId]);
        else delete day[keep.id];
      });
      Object.keys(db.ext || {}).forEach(function(d){
        var day = db.ext[d] || {};
        if (day[bestId]) day[keep.id] = Object.assign({}, day[bestId]);
        else delete day[keep.id];
      });
    }
    if (!keep.phone) { var autre = grp.find(function(e){ return e.s.id !== keep.id && e.s.phone; }); if (autre) keep.phone = autre.s.phone; }
    var autres = grp.map(function(e){ return e.s.id; }).filter(function(x){ return x !== keep.id; });
    purgeStu(autres);
    save();
    render();
  };
  var prev = window.render;
  window.render = function(){
    prev.apply(this, arguments);
    ensureBanner();
  };
  ensureBanner();
})();
</script>
<script>
/* Ajouts : journal des modifications + corbeille, tableau de bord direction, indicateur de synchro, mode hors ligne */
(function(){
  var TYPES = {students:1, classes:1, paiement:1, solde:1, abs:1, ext:1};
  var prev = null, undoing = 0, remote = 0;
  function flat(){ var f = syFlat(), o = {}; for (var k in f) if (TYPES[k.split('/')[0]]) o[k] = f[k]; return o; }
  function fdate(t){ return new Date(t).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); }
  function stuName(id){
    var x = db.students.find(function(y){ return y.id === id; });
    if (x) return x.name;
    try { return JSON.parse((prev || {})['students/' + id]).name; } catch (e) { return id; }
  }
  function lab(k, s){
    var p = k.split('/'), t = p[0], o = null;
    try { o = s ? JSON.parse(s) : null; } catch (e) {}
    if (t === 'students') return 'Élève ' + (o ? o.name : p[1]);
    if (t === 'classes') return 'Classe ' + (o ? o.name : p[1]);
    if (t === 'paiement') return 'Paiement ' + stuName(p[1]);
    if (t === 'solde') return 'Solde ' + stuName(p[1]);
    return (t === 'ext' ? 'Motif ' : 'Absence ') + p[1] + ' · ' + stuName(p[2]);
  }

  /* ---- Journal : comparaison avant/après à chaque sauvegarde ---- */
  var origSave = save;
  save = function(){
    try {
      if (prev === null) prev = flat();
      else {
        var cur = flat();
        if (!undoing && !remote) {
          var ks = {}, b = Date.now() + '' + Math.random().toString(36).slice(2, 5), n = 0;
          Object.keys(prev).concat(Object.keys(cur)).forEach(function(k){ ks[k] = 1; });
          db.journal = db.journal || [];
          for (var k in ks) if (prev[k] !== cur[k]) {
            db.journal.push({t: Date.now(), u: me ? me.name : '?', k: k, o: prev[k] === undefined ? null : prev[k],
              op: prev[k] === undefined ? 'add' : cur[k] === undefined ? 'del' : 'edit', l: lab(k, cur[k] || prev[k]), b: b});
            n++;
          }
          if (db.journal.length > 1500) db.journal = db.journal.slice(-1500);
        }
        prev = cur;
      }
    } catch (e) {}
    return origSave.apply(this, arguments);
  };
  var origApply = syApply;
  syApply = function(){ remote++; try { return origApply.apply(this, arguments); } finally { remote--; } };

  window.jUndo = function(b){
    var es = (db.journal || []).filter(function(e){ return e.b === b && !e.u; });
    if (!es.length) return;
    if (!confirm('Annuler ce changement (' + es.length + ' élément(s)) ?')) return;
    undoing = 1;
    try { es.forEach(function(e){ syApply(e.k, e.o); e.u = 1; }); } finally { undoing = 0; }
    save(); prev = flat(); render(); jOpen(window.__jt);
  };

  function modal(title, html){
    var o = document.getElementById('xmod');
    if (!o) {
      o = document.createElement('div'); o.id = 'xmod';
      o.style.cssText = 'position:fixed;inset:0;z-index:60;background:rgba(20,22,40,.5);display:flex;align-items:flex-end;justify-content:center';
      o.addEventListener('click', function(e){ if (e.target === o) o.remove(); });
      document.body.appendChild(o);
    }
    o.innerHTML = '<div style="background:var(--bg);width:100%;max-width:1000px;height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)"><b>' + title +
      '</b><button class="s" onclick="document.getElementById(\'xmod\').remove()">✕ Fermer</button></div><div style="overflow:auto;padding:12px 14px">' + html + '</div></div>';
  }

  window.xModal = modal;

  window.jOpen = function(tab){
    tab = window.__jt = tab || 'tout';
    var gs = {}, order = [];
    (db.journal || []).slice().reverse().forEach(function(e){ if (!gs[e.b]) { gs[e.b] = []; order.push(e.b); } gs[e.b].push(e); });
    var rows = order.slice(0, 200).map(function(b){
      var es = gs[b], f = es[0], del = es.some(function(e){ return e.op === 'del' && /^(students|classes)\//.test(e.k); });
      if (tab === 'corbeille' && !del) return '';
      var main = es.find(function(e){ return /^(students|classes)\//.test(e.k); }) || f;
      var op = del ? '🗑 Supprimé' : es.some(function(e){ return e.op === 'edit'; }) ? '✏️ Modifié' : '➕ Ajouté';
      var done = es.every(function(e){ return e.u; });
      return '<tr><td>' + fdate(f.t) + '</td><td>' + esc(f.u) + '</td><td>' + op + '</td><td>' + esc(main.l) + (es.length > 1 ? ' <span class="mu">(+' + (es.length - 1) + ')</span>' : '') +

    }

      '<div class="card"><b>' + N + '</b> élèves · <b>' + D + '</b> jour(s) d\'appel · taux global <b>' + pc(Object.keys(perC).reduce(function(s, k){ return s + perC[k].ab; }, 0), N * 2 * D) +
      '</b> · impayés <b>' + imp.toLocaleString('fr-FR') + '</b><p class="mu">Taux = demi-journées d\'absence ÷ (élèves × 2 × jours d\'appel enregistrés).</p></div>' +
      '<h2>Par classe</h2>' + tbl(perC, function(k){ return cmap[k].name; }) +
      '<h2>Par SG</h2>' + tbl(perS, userName) +
      '<h2>Par mois</h2><div class="tbl-scroll"><table><tr><th>Mois</th><th>Jours d\'appel</th><th>Abs. (½ j)</th><th>Taux</th></tr>' + mk.map(function(m){
        return '<tr><td>' + m + '</td><td>' + mD[m] + '</td><td>' + perM[m] + '</td><td><b>' + pc(perM[m], N * 2 * mD[m]) + '</b></td></tr>';
      }).join('') + '</table></div>');
  };

  /* ---- Indicateur de synchronisation + boutons d'en-tête ---- */
  function status(){
    var el = document.getElementById('bsy'); if (!el) return;
    var pend = Object.keys(sy.meta || {}).filter(function(k){ return sy.meta[k].d; }).length, off = !navigator.onLine || syStat.st === 'err';
    el.textContent = !syOn() ? '⚪ Sync off' : off ? '🔴 Hors ligne' + (pend ? ' · ' + pend + ' en attente' : '') : (syStat.st === 'sync' || pend) ? '🟠 ' + (pend || '…') + ' en attente' : '🟢 Synchronisé';

    var dir = isM() || ['de', 'cens', 'sup'].indexOf(me.id) >= 0;

    status();
  }
  var origRender = window.render;
  window.render = function(){ var r = origRender.apply(this, arguments); try { ensureUI(); } catch (e) {} return r; };
  setInterval(status, 3000);

  try { prev = flat(); render(); } catch (e) {}

  /* ---- Hors ligne : fichier sw.js à placer à côté de cette page (http/https uniquement) ---- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});
})();

<script>
/* Correctif transfert + copie entre SG + synchronisation automatique renforcée */
(function(){
  var nzz = function(t){ return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); };
  var clone = function(o){ return JSON.parse(JSON.stringify(o)); };
  var user = function(id){ return db.users.find(function(u){ return u.id === id; }); };

  function keyFor(dst, name){
    var ks = promoKeys(dst.id).slice(); dst.promos = dst.promos || {};
    var f = ks.find(function(k){ return nzz(pn(dst.id, k)) === nzz(name); });
    if (f) return f;
    var k = 'P' + uid(); ks.push(k); dst.promoKeys = ks; dst.promos[k] = name; return k;
  }
  function repair(){          /* répare les transferts déjà faits : rend visibles les promotions orphelines */
    if (!me) return;
    var ch = 0;
    db.classes.forEach(function(c){
      if (!isM() && c.owner !== me.id) return;   /* un SG répare ses propres promotions, le master répare tout */
      var u = user(c.owner); if (!u) return;
      var k = c.promo || 'A', ks = promoKeys(u.id);
      if (ks.indexOf(k) < 0) { u.promoKeys = ks.concat([k]); ch++; }
    });
    if (ch) save();
  }
  function done(msg){
    save(); try { closeSheet(); } catch (e) {}
    var m = document.getElementById('xmod'); if (m) m.remove();
    render(); try { syRun(); } catch (e) {} alert(msg);
  }

  window.trGo = function(){
    var S = $('trS'), T = $('trT'), E = $('trE'), D = $('trD'), src = S && user(S.value);
    if (!src || !E.value || !D.value) return alert('Choisis l\'élément et la destination.');
    if (T.value === 'student') {
      var stu = db.students.find(function(x){ return x.id === E.value; }), dc = db.classes.find(function(c){ return c.id === D.value; });
      if (!stu || !dc) return alert('Élève ou classe introuvable.');
      if (stu.cid === dc.id) return alert('L\'élève est déjà dans cette classe.');
      if (!confirm('Transférer « ' + stu.name + ' » vers « ' + dc.name + ' · ' + userName(dc.owner) + ' » ?\nSes absences cochées le suivent.')) return;
      stu.cid = dc.id; return done('Élève transféré vers ' + dc.name + '.');
    }
    var dst = user(D.value);
    if (!dst || dst.id === src.id) return alert('Choisis un SG de destination différent du SG d\'origine.');
    if (!confirm('Transférer vers ' + dst.name + ' ?\nLes élèves et les absents cochés suivent.')) return;

    if (T.value === 'promo') {
      var k = E.value, nk = keyFor(dst, pn(src.id, k));
      db.classes.forEach(function(c){ if (c.owner === src.id && (c.promo || 'A') === k) { c.owner = dst.id; c.promo = nk; n++; } });
      src.promoKeys = promoKeys(src.id).filter(function(x){ return x !== k; });
      if (src.promos) delete src.promos[k];
    } else {
      var c = db.classes.find(function(x){ return x.id === E.value; });
      if (!c || c.owner !== src.id) return alert('Classe introuvable.');
      c.promo = keyFor(dst, pn(src.id, c.promo || 'A')); c.owner = dst.id; n = 1;
    }
    done('Transfert effectué : ' + n + ' classe(s) déplacée(s) vers ' + dst.name + '.');
  };

  /* ---- Copie (l'original reste chez le SG d'origine) ---- */
  function copyAbs(map){
    ['abs', 'ext'].forEach(function(t){
      var m = db[t] || {};
      Object.keys(m).forEach(function(d){ Object.keys(m[d] || {}).forEach(function(sid){ if (map[sid]) m[d][map[sid]] = clone(m[d][sid]); }); });
    });
  }
  function copyClass(c, src, dst, withAbs){
    var nk = keyFor(dst, pn(src.id, c.promo || 'A')), nc = clone(c), map = {}, n = 0;
    nc.id = uid(); nc.owner = dst.id; nc.promo = nk;
    if (db.classes.some(function(x){ return x.owner === dst.id && x.annee === nc.annee && (x.promo || 'A') === nk && nzz(x.name) === nzz(nc.name); })) nc.name += ' (copie)';
    db.classes.push(nc);
    db.students.filter(function(s){ return s.cid === c.id; }).forEach(function(s){ var ns = clone(s); ns.id = uid(); ns.cid = nc.id; db.students.push(ns); map[s.id] = ns.id; n++; });
    if (withAbs) copyAbs(map);
    return n;
  }
  window.cpOpen = function(){
    var sgs = db.users.filter(function(u){ return u.role === 'surv'; });
    xModal('📋 Copier vers un autre SG',
      '<p class="mu">Crée une copie complète chez un autre SG. L\'original reste en place.</p>' +
      '<p style="margin:8px 0 4px"><b>1. SG d\'origine</b></p><select id="trS" onchange="trRefresh()" style="width:100%">' + sgs.map(function(u){ return '<option value="' + u.id + '">' + esc(u.name) + '</option>'; }).join('') + '</select>' +
      '<p style="margin:8px 0 4px"><b>2. Type</b></p><select id="trT" onchange="trRefresh()" style="width:100%"><option value="promo">Une promotion (avec ses classes et élèves)</option><option value="class">Une classe (avec ses élèves)</option><option value="student">Un élève (vers une classe)</option></select>' +
      '<p style="margin:8px 0 4px"><b>3. Élément à copier</b></p><select id="trE" style="width:100%"></select>' +
      '<p style="margin:8px 0 4px"><b>4. Destination</b></p><select id="trD" style="width:100%"></select>' +
      '<label style="display:block;margin:10px 0"><input type="checkbox" id="cpA"> Copier aussi les absences cochées</label>' +
      '<button onclick="cpGo()">📋 Copier</button>');
    trRefresh();
  };
  window.cpGo = function(){
    var S = $('trS'), T = $('trT'), E = $('trE'), D = $('trD'), A = $('cpA').checked, src = S && user(S.value);
    if (!src || !E.value || !D.value) return alert('Choisis l\'élément et la destination.');
    if (T.value === 'student') {
      var s = db.students.find(function(x){ return x.id === E.value; }), dc = db.classes.find(function(c){ return c.id === D.value; });
      if (!s || !dc) return alert('Élève ou classe introuvable.');
      if (db.students.some(function(x){ return x.cid === dc.id && nzz(x.name) === nzz(s.name); })) return alert('Un élève de même nom existe déjà dans cette classe.');
      if (!confirm('Copier « ' + s.name + ' » vers « ' + dc.name + ' · ' + userName(dc.owner) + ' » ?')) return;
      var ns = clone(s), map = {}; ns.id = uid(); ns.cid = dc.id; db.students.push(ns); map[s.id] = ns.id; if (A) copyAbs(map);
      return done('Élève copié.');
    }
    var dst = user(D.value);
    if (!dst || dst.id === src.id) return alert('Choisis un SG de destination différent du SG d\'origine.');
    if (!confirm('Copier vers ' + dst.name + ' ?')) return;
    var cs = T.value === 'promo' ? db.classes.filter(function(c){ return c.owner === src.id && (c.promo || 'A') === E.value; }) : db.classes.filter(function(c){ return c.id === E.value && c.owner === src.id; }), ne = 0;
    cs.forEach(function(c){ ne += copyClass(c, src, dst, A); });
    done('Copie effectuée : ' + cs.length + ' classe(s), ' + ne + ' élève(s) vers ' + dst.name + '.');
  };


  /* ---- Centre des promotions (master) : retrouver, envoyer, copier, renommer, créer, exporter, supprimer ---- */
  var fpSt = {f: '', d: ''};
  function absOf(sid, ds){ var n = 0; ds.forEach(function(d){ var r = (db.abs[d] || {})[sid]; if (r) n += (r.m ? 1 : 0) + (r.s ? 1 : 0); }); return n; }
  function groups(){
    var p = rapAnPeriode(), ds = Object.keys(db.abs || {}).filter(function(d){ return d >= p[0] && d <= p[1]; }), g = {}, cm = {};
    db.classes.forEach(function(c){ var k = c.promo || 'A', id = c.owner + '|' + k, x = g[id] = g[id] || {o: c.owner, k: k, cs: [], e: 0, ab: 0, du: 0}; x.cs.push(c); cm[c.id] = x; });
    db.students.forEach(function(s){ var x = cm[s.cid]; if (!x) return; x.e++; x.ab += absOf(s.id, ds); try { x.du += restePaie(s.id) || 0; } catch (e) {} });
    return {g: g, ds: ds};
  }
  function hub(msg){ save(); try { closeSheet(); } catch (e) {} render(); try { syRun(); } catch (e) {} fpOpen(); if (msg) alert(msg); }
  window.fpOpen = function(){
    var a = document.getElementById('fpF'), b = document.getElementById('fpD');
    var q0 = document.getElementById('fpQ'); if (a) fpSt.f = a.value; if (b) fpSt.d = b.value; if (q0) fpSt.q = q0.value;
    var sgs = db.users.filter(function(u){ return u.role === 'surv'; }), G = groups().g;
    var ks = Object.keys(G).map(function(id){ return G[id]; }).filter(function(x){ return !fpSt.f || x.o === fpSt.f; })
      .sort(function(x, y){ return nzz(userName(x.o) + pn(x.o, x.k)) < nzz(userName(y.o) + pn(y.o, y.k)) ? -1 : 1; });
    var T = {c: 0, e: 0, ab: 0, du: 0}; ks.forEach(function(x){ T.c += x.cs.length; T.e += x.e; T.ab += x.ab; T.du += x.du; });

    var qo = Object.keys(G).map(function(id){ return G[id]; }).sort(function(x, y){ return nzz(pn(x.o, x.k)) < nzz(pn(y.o, y.k)) ? -1 : 1; })
      .map(function(x){ var v = x.o + '|' + x.k; return '<option value="' + v + '"' + (fpSt.q === v ? ' selected' : '') + '>' + esc(pn(x.o, x.k)) + ' — ' + esc(userName(x.o)) + '</option>'; }).join('');

      '<p class="mu" style="margin:8px 0 4px">Vers le SG (aussi pour Copier et Nouvelle promotion) :</p><select id="fpD" style="width:100%">' + opt(fpSt.d) + '</select>' +
      '<button style="margin-top:8px" onclick="fpQuick()">🚀 Envoyer</button></div>' +
      '<p class="mu" style="margin-bottom:4px">Voir :</p><select id="fpF" onchange="fpOpen()" style="width:100%;margin-bottom:8px"><option value="">Tous les SG</option>' + opt(fpSt.f) + '</select>' +
      '<div class="row" style="margin-bottom:8px"><button onclick="fpA(\'new\')">+ Nouvelle promotion</button></div>' +
      '<div class="card"><b>' + ks.length + '</b> promotion(s) · <b>' + T.c + '</b> classe(s) · <b>' + T.e + '</b> élève(s) · <b>' + T.ab + '</b> abs. (½ j) · impayés <b>' + T.du.toLocaleString('fr-FR') + '</b></div>' +
      (ks.map(function(x){
        var q = '\'' + x.o + '\',\'' + x.k + '\'';
        return '<div style="border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--card)"><b>' + esc(pn(x.o, x.k)) + '</b> <span class="mu">· ' + esc(userName(x.o)) + '</span>' +
          '<div class="mu">' + x.cs.length + ' classe(s) · ' + x.e + ' élève(s) · ' + x.ab + ' abs. · ' + x.du.toLocaleString('fr-FR') + ' impayés</div>' +

      }).join('') || '<p class="mu">Aucune promotion.</p>'));

  window.fpQuick = function(){ var q = ((document.getElementById('fpQ') || {}).value || '').split('|'); if (q.length === 2) fpA('mv', q[0], q[1]); };
  window.fpA = function(act, o, k){

  /* ---- Synchronisation automatique : relance rapide en attente / hors connexion ---- */
