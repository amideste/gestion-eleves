.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
h2{margin:0 0 14px;font-size:19px;font-weight:700;color:var(--tx)}
input,select{padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--mu);opacity:.8}
input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 4px var(--ring)}
button,.btn{padding:10px 16px;border:0;border-radius:12px;background:var(--pr);color:var(--onpr);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:filter .15s,box-shadow .15s,background .15s,transform .1s;box-shadow:0 1px 3px rgba(60,64,110,.18)}
button:hover,.btn:hover{filter:brightness(1.07)}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed;filter:none}
button.s{background:var(--card);color:var(--pr);border:1.5px solid var(--bd);box-shadow:none}
button.s:hover,.btn.s:hover{background:var(--soft);filter:none}
button.ab{background:transparent;color:var(--mu);border:1.5px solid var(--bd);padding:6px 12px;box-shadow:none;font-weight:600}
button.ab.on{background:var(--er);color:var(--onpr);border-color:var(--er)}
button.d{background:transparent;color:var(--er);border:1.5px solid var(--bd);padding:6px 12px;box-shadow:none}
button.d:hover{background:rgba(192,80,74,.1);filter:none}
button.hb{display:block;width:100%;max-width:340px;margin:0 auto 7px;padding:9px 16px;font-size:16px;font-weight:700;line-height:1.2;border-radius:13px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr);box-shadow:0 6px 16px rgba(101,88,211,.25)}
button.hb:hover{filter:none;transform:translateY(-1px);box-shadow:0 10px 22px rgba(101,88,211,.3)}
button.hb.alt{background:linear-gradient(135deg,#2B8F88,#47B4AB);color:#fff;margin-bottom:3px;box-shadow:0 4px 10px rgba(43,143,136,.25)}
#home{text-align:center;position:relative;overflow:hidden;border-radius:24px;box-shadow:0 18px 48px rgba(60,64,110,.13)}
#home::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#6558D3,#5BB7C9,#8B83E8)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row>input{flex:1;min-width:130px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--soft);color:var(--mu);font-weight:600;font-size:13px}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(101,88,211,.045)}
.cls{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:border-color .15s,box-shadow .15s}
.cls:hover{border-color:var(--pr2);box-shadow:var(--sh)}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.er{color:var(--er)}
p.mu{margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:9px 18px}
.login{max-width:380px;margin:10vh auto;padding:26px 22px}
.login.card{border-radius:22px}
.login h2{text-align:center;font-size:21px}
.login input{width:100%;margin-bottom:12px}
button.ml{display:block;margin:8px auto 0;padding:4px 8px;background:transparent;color:var(--mu);border:0;box-shadow:none;font-size:10px;font-weight:400;opacity:.12;transition:opacity .2s}
button.ml:hover,button.ml:focus-visible{opacity:.7;filter:none}
.syl{text-align:center;font-size:12px;color:var(--mu);cursor:pointer;margin:-6px 0 8px}
.pub{margin:8px 0 0;padding:8px 12px 10px;border-radius:16px;text-align:center;background:linear-gradient(90deg,#1a1514 0%,#1d1013 55%,#4a0516 100%);box-shadow:0 8px 22px rgba(60,0,15,.35)}
.pub-t{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.05em;color:#ffcc33}
.pub-n{margin-top:1px;font-size:16px;font-weight:800;letter-spacing:.06em;color:#fff}
.pub-d{margin:5px 0 7px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.1);font-size:11.5px;line-height:1.3;color:#cfc8c8}
.pub-w{display:inline-block;padding:6px 14px;border-radius:999px;background:#0e9f6e;color:#fff;font-size:12.5px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.pub-w:hover{filter:brightness(1.08)}
.mlw{display:table;margin:8px auto 0;position:relative;padding-bottom:7px}
.mlw button.ml{margin:0}
.mlw::before,.mlw::after{content:"";position:absolute;height:2px;border-radius:2px;background:#6f6a63;opacity:.75}
.mlw::before{left:6%;right:10%;bottom:4px;transform:rotate(-1.2deg)}
.mlw::after{left:16%;right:2%;bottom:0;height:1.5px;transform:rotate(.8deg);opacity:.6}
/* Couleurs des boutons dans les comptes : valeurs FIXES, identiques sur téléphone, tablette et ordinateur */
body.acct button,body.acct .btn{--c:#2563EB;--cd:#1E3A8A;background:var(--c);color:#fff;border:1.5px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.2);-webkit-tap-highlight-color:transparent}
body.acct button:hover,body.acct .btn:hover{filter:brightness(.92)}
body.acct button:active,body.acct .btn:active{background:var(--cd);border-color:var(--cd);transform:scale(.97);filter:none}
body.acct button.on,body.acct button.ab.on{background:var(--cd);border-color:var(--cd);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
body.acct button:disabled{opacity:.5}
body.acct button.s,body.acct .btn.s{--c:#0369A1;--cd:#0C4A6E}
body.acct button.d{--c:#DC2626;--cd:#991B1B}
body.acct button.wa{--c:#16A34A;--cd:#166534}
body.acct button.sm{--c:#DB2777;--cd:#9D174D}
body.acct button.am{--c:#EA580C;--cd:#9A3412}
body.acct button.as{--c:#7C3AED;--cd:#4C1D95}
body.acct button.ar{--c:#0D9488;--cd:#115E59}
body.acct button.mg{--c:#4F46E5;--cd:#3730A3}
.mlist{height:50vh;min-height:220px;overflow-y:auto;border:1.5px solid var(--bd);border-radius:14px;padding:10px;background:var(--bg)}
.mrow{display:flex;margin-bottom:8px}.mrow.me{justify-content:flex-end}
.mbub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#E5E7EB;color:#1F2937;word-break:break-word;font-size:15px}
.mrow.me .mbub{background:#2563EB;color:#fff;border-radius:14px 14px 4px 14px}
.mnm{font-size:11px;opacity:.75;margin-bottom:2px}
.mx{padding:0 6px!important;font-size:10px!important;margin-left:6px;box-shadow:none!important}
.mbd{background:#DC2626;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.bc button{padding:6px 11px;font-size:13px;border-radius:10px}
.bc .bk{background:var(--pr);color:var(--onpr);border:0}
.bc .sep{color:var(--mu);font-size:14px}
.bc .cur{font-size:13px;font-weight:700;color:var(--tx);padding:6px 4px}
.login .bc{justify-content:center}
/* ===== Adaptation à tous les écrans (téléphone, tablette, ordinateur) ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word;min-width:0}
img,svg,video,canvas{max-width:100%;height:auto}
main,.card,.cls,.row>*{min-width:0}
.wrap{-webkit-overflow-scrolling:touch}
@media (min-width:1400px){main{max-width:1280px}}
@media (max-width:1024px){main{max-width:100%}}
@media (max-width:640px){
  header{padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
  header b{font-size:15px}
  main{padding:12px 10px}
  .card{padding:14px;border-radius:14px;margin-bottom:12px}
  h2{font-size:17px;margin-bottom:10px}
  .row{flex-direction:column;align-items:stretch;gap:8px}
  .row>input,.row>select,.row>button,.row>.btn{flex:none;width:100%;min-width:0}
  input,select{width:100%;min-width:0}
  button,.btn{padding:10px 14px}
  button.ab{padding:6px 10px}
  button.hb{max-width:100%}
  .tabs{gap:6px}
  .tabs button{flex:1 1 auto;padding:8px 12px;font-size:13px}
  .bc{gap:4px}
  .bc button{padding:5px 9px;font-size:12px}
  table{font-size:13px}
  th,td{padding:8px 9px}
  .cls{padding:12px;flex-wrap:wrap}
  .login{margin:4vh auto;padding:20px 16px}
  .login input{width:100%}
  .mbub{max-width:92%}
  /* Largeurs fixes écrites directement dans le HTML du logiciel */
  [style*="width:80px"],[style*="width:120px"],[style*="width:130px"],[style*="width:140px"],[style*="width:150px"],[style*="width:42px"]{width:100%!important;min-width:0!important;max-width:100%!important}
  [style*="min-width:130px"]{min-width:0!important}
  [style*="max-width:"]{max-width:100%!important}
  [style*="flex-wrap:nowrap"]{flex-wrap:wrap!important}
}
@media (max-width:380px){
  header b{font-size:14px}
  button,.btn{font-size:13px}
  .card{padding:12px}
}
@media (pointer:coarse){
  button,.btn,input,select{min-height:44px}
  button.ab,button.bc,.bc button{min-height:38px}
}
.logo-home{display:block;width:96px;height:96px;border-radius:22px;margin:4px auto 12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;width:100%}
@media (max-width:640px){table{min-width:0}}

<style>
.retour-auto{margin:0 0 10px}
.retour-auto button{display:inline-flex;align-items:center;gap:6px}
</style>
<script>
/* Bouton « ← Retour » sur chaque écran ouvert (codes, boîtes, onglets, classes…) */
(function(){
  var hist = [], lastKey = null, lastMe = null, origRender = window.render;
  function snap(){
    return JSON.stringify({page:view.page, tab:view.tab, cid:view.cid, promo:view.promo,
      sg:view.sg, target:view.target, date:view.date});
  }
  function goBack(){
    if (!hist.length) return;
    var prev = hist.pop();
    lastKey = prev;
    var o = JSON.parse(prev);
    Object.keys(view).forEach(function(k){ delete view[k]; });
    Object.assign(view, o);
    pending = null;
    window.render();
  }
  function addBack(){
    var a = document.getElementById('app');
    if (!a) return;
    a.querySelectorAll('table').forEach(function (t) {
      var par = t.parentElement;
      if (par && !par.classList.contains('wrap') && !par.classList.contains('tbl-scroll')) {
        var box = document.createElement('div');
        box.className = 'tbl-scroll';
        par.insertBefore(box, t);
        box.appendChild(t);
      }
    });
    var home = a.querySelector('#home');
    if (home && !home.querySelector('.logo-home')) {
      var ic = document.querySelector('link[rel="icon"]');
      if (ic) { var lg = document.createElement('img'); lg.className = 'logo-home'; lg.alt = 'Logo'; lg.src = ic.href; home.insertBefore(lg, home.firstChild); }
    }
    var old = a.querySelector('.retour-auto');
    if (old) old.remove();
    if (!hist.length) return;
    var d = document.createElement('div');
    d.className = 'retour-auto';
    d.innerHTML = '<button class="s">← Retour</button>';
    d.firstChild.onclick = goBack;
    a.insertBefore(d, a.firstChild);
  }
  window.render = function(){
    var meKey = me ? me.id : null;
    if (meKey !== lastMe) { hist.length = 0; lastMe = meKey; lastKey = null; }
    var k = snap();
    if (lastKey !== null && k !== lastKey) {
      hist.push(lastKey);
      if (hist.length > 60) hist.shift();
    }
    lastKey = k;
    origRender.apply(this, arguments);
    addBack();
  };
  window.render();
})();
</script>
