<script>
/* ===== Couche de données (à remplacer par une API + base de données à l'hébergement) ===== */
const KEY='gestion_eleves_v2';
const hs=t=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const MASTER_MAILS_H='1yb4o0qqdjl'; /* empreinte de récupération de MasterLog */
const MASTER_TEL='0195185256'; /* numéro de MasterLog (WhatsApp / SMS) */
function seed(){
  const N=['SG AMIKPÉMI','SG CRECEL','SG GAHOUNGA','SG SOSSOUKPE','SG MIGAN','SG A DÉFINIR 1','SG A DÉFINIR 2','SG A DÉFINIR 3','SG A DÉFINIR 4','SG A DÉFINIR 5'];
  const u=[{id:'de',name:'Le Directeur',login:'de',pass:'de123',role:'de'},{id:'cens',name:'Le Censeur',login:'censeur',pass:'cens123',role:'de'},{id:'compt',name:'Le Comptable',login:'comptable',pass:'',role:'de'},{id:'sup',name:'Superviseur (Le SG)',login:'superviseur',pass:'admin123',role:'sup'}];
  N.forEach((n,i)=>u.push({id:'s'+(i+1),name:n,login:'sga'+(i+1),pass:'1234',role:'surv'}));
  return {users:u,classes:[],students:[]};
}
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()}
if(!db.users.some(u=>u.id==='cens'))db.users.splice(1,0,{id:'cens',name:'Le Censeur',login:'censeur',pass:'cens123',role:'de'});
if(!db.users.some(u=>u.id==='compt')){const ci=db.users.findIndex(u=>u.id==='cens');db.users.splice(ci>=0?ci+1:2,0,{id:'compt',name:'Le Comptable',login:'comptable',pass:'',role:'de'})}
if(!db.users.some(u=>u.id==='master'))db.users.push({id:'master',name:'MasterLog',login:'masterlog',pass:'',role:'master'});
db.abs=db.abs||{};
db.reqs=db.reqs||[];db.msgs=db.msgs||[];db.ext=db.ext||{};db.set=db.set||{};db.profs=db.profs||[];db.pabs=db.pabs||{};
if(!db.v3){db.users.forEach(u=>{if(['1234','de123','cens123','admin123'].includes(u.pass))u.pass=''});db.v3=1}
const okCode=c=>/^[A-Za-z0-9]{4,}$/.test(c);
db.users.forEach(u=>{if(u.id==='cens'&&(u.name==='Le Censeur/Comptable'||u.name==='Censeur'))u.name='Le Censeur';if(u.id==='de'&&(u.name==='DE'||u.name==='Directeur'))u.name='Le Directeur';if(u.id==='sup'&&u.name==='Superviseur')u.name='Superviseur (Le SG)'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Sauvegarde impossible')}syAfterSave()}
const uid=()=>Math.random().toString(36).slice(2,10);

/* ===== Synchronisation multi-appareils (Firebase Realtime Database, API REST) ===== */
const SY_KEY='gestion_eleves_sync_v1';
let sy;try{sy=JSON.parse(localStorage.getItem(SY_KEY))||{}}catch(e){sy={}}
sy.meta=sy.meta||{};
/* >>> Renseigne ici ton adresse Firebase et ton code de synchronisation : la synchronisation sera automatique sur tous les appareils <<< */
const SY_URL='https://absence-eleves-ceg-1-all-default-rtdb.firebaseio.com';  /* exemple : 'https://mon-projet-default-rtdb.firebaseio.com' */
const SY_ROOM='ceg1c2y6pyvy5o0jxcow'; /* exemple : 'ceg1allada2026secret' (12 caractères minimum, lettres/chiffres/_/-) */
if(SY_URL&&SY_ROOM&&(sy.url!==SY_URL.replace(/\/+$/,'')||sy.room!==SY_ROOM)){sy={url:SY_URL.replace(/\/+$/,''),room:SY_ROOM,init:0,meta:{}};try{localStorage.setItem(SY_KEY,JSON.stringify(sy))}catch(e){}}
const syStat={st:'',last:0};let syBusy=0,syTm=null,syPend=0,syNew=0;
const syOn=()=>!!(sy.url&&sy.room);
const syT=()=>Date.now()+(sy.off||0);
const sySave=()=>{try{localStorage.setItem(SY_KEY,JSON.stringify(sy))}catch(e){}};
const syF=k=>k.replace(/[%.$#\[\]\/]/g,c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0'));
const syD=k=>decodeURIComponent(k);
/* Ajout des comptes SG 9 et 10 sur les appareils déjà installés (sans écraser ce que la synchronisation a déjà récupéré) */
if(!db.sg10)[['s9','SG A DÉFINIR 4','sga9'],['s10','SG A DÉFINIR 5','sga10']].forEach(([id,name,login])=>{
  if(db.users.some(u=>u.id===id))return;
  const o={id,name,login,pass:'',role:'surv'};db.users.push(o);
  if(sy.init){sy.meta['users/'+id]={t:0,s:JSON.stringify(o),d:0};sySave()}
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}});
db.sg10=1;
function syFlat(){
  const f={};
  (db.users||[]).forEach(o=>f['users/'+o.id]=JSON.stringify(o));
  (db.classes||[]).forEach(o=>f['classes/'+o.id]=JSON.stringify(o));
  (db.students||[]).forEach(o=>f['students/'+o.id]=JSON.stringify(o));
  (db.reqs||[]).forEach(o=>f['reqs/'+o.u]=JSON.stringify(o));
  (db.msgs||[]).forEach(o=>f['msgs/'+o.id]=JSON.stringify(o));
  (db.profs||[]).forEach(o=>f['profs/'+o.id]=JSON.stringify(o));
  Object.entries(db.set||{}).forEach(([k,v])=>f['set/'+k]=JSON.stringify(v));
  ['abs','ext','pabs'].forEach(n=>Object.entries(db[n]||{}).forEach(([d,day])=>Object.entries(day||{}).forEach(([sid,r])=>f[n+'/'+d+'/'+sid]=JSON.stringify(r))));
  return f}
function syDiff(){
  const f=syFlat(),n=syT();let ch=0;
  for(const k in f){const m=sy.meta[k];if(!m||m.s!==f[k]){sy.meta[k]={t:n,s:f[k],d:1};ch++}}
  for(const k in sy.meta){const m=sy.meta[k];if(!(k in f)&&m.s!==null){sy.meta[k]={t:n,s:null,d:1};ch++}}
  return ch}
function syApply(k,s){
  const p=k.split('/'),t=p[0];
  if(t==='users'||t==='classes'||t==='students'||t==='reqs'||t==='msgs'||t==='profs'){
    const idk=t==='reqs'?'u':'id',a=db[t]=db[t]||[],i=a.findIndex(o=>o[idk]===p[1]);
    if(s===null){if(i>=0)a.splice(i,1)}else{const o=JSON.parse(s);if(t==='msgs'&&i<0&&me&&o.from!==me.id&&(o.to==='all'||o.to===me.id))syNew++;if(i>=0)a[i]=o;else a.push(o)}
  }else if(t==='set'){db.set=db.set||{};if(s===null)delete db.set[p[1]];else db.set[p[1]]=JSON.parse(s)}
  else if(t==='abs'||t==='ext'||t==='pabs'){
    const m=db[t]=db[t]||{};
    if(s===null){if(m[p[1]]){delete m[p[1]][p[2]];if(!Object.keys(m[p[1]]).length)delete m[p[1]]}}
    else(m[p[1]]=m[p[1]]||{})[p[2]]=JSON.parse(s)}}
function syTxt(){
  if(!syOn())return 'désactivée';
  if(syStat.st==='sync')return 'en cours…';
  if(syStat.st==='err')return 'hors ligne';
  if(syStat.last){const s=Math.round((Date.now()-syStat.last)/1000);return 'à jour'+(s<90?'':' · il y a '+Math.round(s/60)+' min')}
  return 'en attente'}
function syUI(){document.querySelectorAll('.syt').forEach(e=>e.textContent=syTxt())}
function syAfterSave(){if(!syOn())return;if(syDiff())sySave();clearTimeout(syTm);syTm=setTimeout(syRun,1200)}
function syRefresh(){
  if(me&&view.page==='msg'){msgPaint();return}
  msgBadge();
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){syPend=1;return}
  const y=scrollY;render();scrollTo(0,y)}
async function syRun(){
  if(!syOn()||syBusy)return;
  syBusy=1;syStat.st='sync';syUI();
  try{
    const b0=sy.url.replace(/\/+$/,'')+'/rooms/'+encodeURIComponent(sy.room),base=b0+'/e';
    if(!sy.offAt||Date.now()-sy.offAt>1800000){
      try{const a=Date.now(),q=await fetch(b0+'/ping.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({'.sv':'timestamp'})});
        if(q.ok){const v=await q.json(),b=Date.now();if(typeof v==='number'){sy.off=v-(a+b)/2;sy.offAt=b}}}catch(e){}}
    const W=(sy.since||0)-120000;
    let inc=!!(sy.init&&sy.since&&!sy.noIdx&&Date.now()-(sy.fullAt||0)<600000);
    if(inc)for(const k in sy.meta){const m=sy.meta[k];if(m.d&&m.t<W){inc=false;break}}
    let rem=null;
    if(inc){
      const r=await fetch(base+'.json?orderBy=%22t%22&startAt='+W,{cache:'no-store'});
      if(r.ok)rem=(await r.json())||{};else if(r.status===400)sy.noIdx=1;
    }
    if(rem===null){
      const r=await fetch(base+'.json',{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      rem=(await r.json())||{};sy.fullAt=Date.now();
    }
    const n=syT(),firstRun=!sy.init;syNew=0;
    for(const fk in rem){const R=rem[fk];if(R&&typeof R.t==='number'&&R.t>(sy.since||0))sy.since=R.t}
    if(!sy.init){
      const f=syFlat();
      for(const k in f){const has=syF(k) in rem;sy.meta[k]={t:has?0:n,s:f[k],d:has?0:1}}
      sy.init=1;
    }else syDiff();
    let chg=0;const up={};
    const keys=new Set(Object.keys(rem).map(syD));for(const k in sy.meta)keys.add(k);
    keys.forEach(k=>{
      const R=rem[syF(k)],m=sy.meta[k];
      if(R&&typeof R==='object'&&(!m||R.t>m.t)){
        const s=typeof R.v==='string'?R.v:null;
        if(!m||m.s!==s){syApply(k,s);chg++}
        sy.meta[k]={t:R.t,s,d:0};
      }else if(m&&m.d&&(!R||m.t>R.t))up[syF(k)]={t:m.t,v:m.s};
    });
    if(Object.keys(up).length){
      const p=await fetch(base+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(up)});
      if(!p.ok)throw new Error('HTTP '+p.status);
      for(const fk in up){const k=syD(fk);if(sy.meta[k]&&sy.meta[k].t===up[fk].t)sy.meta[k].d=0}
    }
    sySave();
    if(syNew){if(!firstRun)msgBeep();syNew=0}
    if(chg){
      me=me?(db.users.find(u=>u.id===me.id)||null):null;
      try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
      syStat.st='ok';syStat.last=Date.now();syBusy=0;syRefresh();
    }
    syStat.st='ok';syStat.last=Date.now();
  }catch(e){syStat.st='err'}
  syBusy=0;syUI()}
document.addEventListener('focusout',()=>setTimeout(()=>{
  if(!syPend)return;const a=document.activeElement;
  if(!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){syPend=0;syRefresh()}},300));
let syTick=0;
setInterval(()=>{syTick++;if(syOn()&&!document.hidden&&(syTick%3===0||(me&&view.page==='msg')))syRun();syUI()},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syRun()});
addEventListener('online',syRun);
setTimeout(syRun,800);
document.addEventListener('touchstart',()=>{},{passive:true});
const syMaster=()=>!!(me&&me.role==='master');
function syConn(url,room){

const pdfPanel=cid=>`<div class="row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)"><b>📄 PDF des absents</b>
<select id="pp"><option value="j">Par jour</option><option value="s">Par semaine</option><option value="m">Par mois</option><option value="p">Période définie</option></select>

function pdfRange(){
  const t=$('pp').value,ref=$('pd').value||today(),d=new Date(ref+'T12:00:00');
  if(t==='j')return[ref,ref,'Jour : '+frD(ref)];
  if(t==='s'){const a=new Date(d);a.setDate(d.getDate()-(d.getDay()+6)%7);const b=new Date(a);b.setDate(a.getDate()+6);return[fmtD(a),fmtD(b),'Semaine du '+frD(fmtD(a))+' au '+frD(fmtD(b))]}
  if(t==='m'){const a=fmtD(new Date(d.getFullYear(),d.getMonth(),1)),b=fmtD(new Date(d.getFullYear(),d.getMonth()+1,0));return[a,b,'Mois : '+d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})]}
  const a=$('d1').value,b=$('d2').value;
  return[a,b,'Du '+(a?frD(a):'?')+' au '+(b?frD(b):'?')]}
function exportPdf(cid){
  if(!window.jspdf)return alert('Module PDF non chargé. Vérifie ta connexion internet.');
  const [a,b,label]=pdfRange();
  if(!a||!b||a>b)return alert('Choisis une période valide (date de début avant la date de fin).');
  const agg={};
  Object.keys(db.abs).filter(d=>d>=a&&d<=b).forEach(d=>{
    Object.entries(db.abs[d]).forEach(([sid,r])=>{
      const st=db.students.find(x=>x.id===sid);if(!st)return;
      const c=db.classes.find(x=>x.id===st.cid);if(!c)return;
      if(cid?c.id!==cid:((view.fs&&c.owner!==view.fs)||(view.fc&&c.id!==view.fc)))return;
      const o=agg[sid]=agg[sid]||{st,c,n:0};
      o.n+=(r.m?1:0)+(r.s?1:0)})});
  const list=Object.values(agg).sort((x,y)=>x.c.name.localeCompare(y.c.name,'fr')||x.st.name.localeCompare(y.st.name,'fr'));
  if(!list.length)return alert('Aucune absence sur cette période.');
  const rows=list.map(o=>[o.st.name,o.st.sex==='M'?'M':'F',o.c.name,label,o.n,o.st.phone||'','','']);
  const doc=new window.jspdf.jsPDF({orientation:'landscape'});
  const cl=cid?db.classes.find(x=>x.id===cid):null;
  doc.setFontSize(15);doc.text('CEG1 ALLADA - Liste des absents'+(cl?' - Classe : '+cl.name:''),14,16);
  doc.setFontSize(10);doc.text(label,14,23);
  doc.text(rows.length+' élève(s) absent(s)',14,29);
  doc.autoTable({startY:34,
    head:[['Nom complet','Sexe','Classe','Période','Nbre de demi-journées d\'absence','N° Tél parent','Motif de l\'absence','Observation']],
    body:rows,
    styles:{fontSize:9,cellPadding:2.5,valign:'middle',lineColor:[150,150,150],lineWidth:.1,minCellHeight:10},
    headStyles:{fillColor:[36,87,214],halign:'center'},
    columnStyles:{0:{cellWidth:50},1:{cellWidth:13,halign:'center'},2:{cellWidth:24},3:{cellWidth:50},4:{cellWidth:28,halign:'center'},5:{cellWidth:32},6:{cellWidth:36},7:{cellWidth:36}}});
  doc.save('absents_'+(cl?cl.name.replace(/\s+/g,'_')+'_':'')+a+'_'+b+'.pdf')}

function normSex(v){const s=String(v||'').trim().toLowerCase();
  if(/^(m|g|h)/.test(s))return'M'; if(/^f/.test(s))return'F'; return null}
function check(name,sex,phone,cid,batch=[]){
  name=String(name||'').trim().replace(/\s+/g,' ');phone=String(phone||'').trim();sex=normSex(sex);
  if(!name)return{err:'Nom manquant'};
  if(!sex)return{err:'Sexe invalide (M/F)'};
  if(phone&&phone.replace(/\D/g,'').length<6)return{err:'Téléphone invalide (laisse vide si tu ne l\'as pas)'};
  const k=name.toLowerCase()+'|'+phone.replace(/\D/g,'');
  const dup=x=>x.name.toLowerCase()+'|'+String(x.phone||'').replace(/\D/g,'')===k;
  if(db.students.some(s=>s.cid===cid&&dup(s))||batch.some(dup))return{err:'Doublon'};
  return{name,sex,phone};
}
async function importFile(f){
  if(!f)return;let rows=[];
  try{
    const buf=await f.arrayBuffer();
    if(/\.docx$/i.test(f.name)){
      const h=(await mammoth.convertToHtml({arrayBuffer:buf})).value;
      const d=new DOMParser().parseFromString(h,'text/html');
      d.querySelectorAll('tr').forEach(tr=>rows.push([...tr.children].map(td=>td.textContent.trim())));
    }else{
      const wb=XLSX.read(buf,{type:'array'});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    }
  }catch(e){return alert('Fichier illisible : '+e.message)}
  rows=rows.filter(r=>r.some(x=>String(x).trim()));
  if(rows.length&&/nom/i.test(rows[0][0]))rows.shift();
  const batch=[];pending=rows.map(r=>{
    const x=check(r[0],r[1],r[2],view.cid,batch);
    if(!x.err)batch.push(x);
    return{raw:r,x}});
  render();
}

async function importProfs(f){
  if(!f||!canProf()||!view.subj)return;let rows=[];
  try{
    const buf=await f.arrayBuffer();
    if(/\.docx$/i.test(f.name)){
      if(!window.mammoth)return alert('Module Word non chargé. Vérifie ta connexion internet.');
      const h=(await mammoth.convertToHtml({arrayBuffer:buf})).value,d=new DOMParser().parseFromString(h,'text/html');
      d.querySelectorAll('tr').forEach(tr=>rows.push([...tr.children].map(td=>td.textContent.trim())));
      if(!rows.length)d.querySelectorAll('p,li').forEach(e=>rows.push([e.textContent.trim()]));
    }else{
      if(!window.XLSX)return alert('Module Excel non chargé. Vérifie ta connexion internet.');
      const wb=XLSX.read(buf,{type:'array'});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    }
  }catch(e){return alert('Fichier illisible : '+e.message)}
  rows=rows.filter(r=>r.some(x=>String(x).trim()));
  if(rows.length&&/^(n°|no|nom)/i.test(String(rows[0][0]).trim()))rows.shift();
  db.profs=db.profs||[];const add=[];let skip=0;
  rows.forEach(r=>{
    const n=String(r[0]||'').trim().replace(/\s+/g,' ');let t=String(r[1]||'').trim();
    if(!n)return void skip++;
    if(t.replace(/\D/g,'').length<6)t='';
    if(db.profs.some(p=>p.subj===view.subj&&nz(p.name)===nz(n))||add.some(p=>nz(p.name)===nz(n)))return void skip++;
    add.push({id:uid(),subj:view.subj,name:n,phone:t})});
  if(!add.length)return alert('Aucun professeur à importer'+(skip?' ('+skip+' ligne(s) vide(s) ou déjà existante(s)).':'.'));
  if(!confirm('Importer '+add.length+' professeur(s) dans « '+view.subj+' » ?'+(skip?'\n'+skip+' ligne(s) ignorée(s) (vides ou déjà existantes).':'')))return;
  add.forEach(o=>db.profs.push(o));save();render()}

function profAbsList(sj,a,b){
  const rows=[];
  Object.keys(db.pabs||{}).filter(d=>d>=a&&d<=b).forEach(d=>Object.entries(db.pabs[d]).forEach(([pid,r])=>{
    const p=(db.profs||[]).find(x=>x.id===pid);if(!p||(sj&&p.subj!==sj)||!(r.m1||r.m2||r.s1||r.s2))return;
    rows.push({d,p,type:profSlotTxt(r),motif:r.motif||'',obs:r.obs||'',f:{m1:!!r.m1,m2:!!r.m2,s1:!!r.s1,s2:!!r.s2}})}));
  return rows.sort((x,y)=>x.d.localeCompare(y.d)||SUBJ.indexOf(x.p.subj)-SUBJ.indexOf(y.p.subj)||x.p.name.localeCompare(y.p.name,'fr'))}
function profSummary(list){
  const m={};
  list.forEach(o=>{const t=m[o.p.id]=m[o.p.id]||{p:o.p,m1:0,m2:0,s1:0,s2:0,days:new Set()};
    ['m1','m2','s1','s2'].forEach(k=>{if(o.f[k])t[k]++});t.days.add(o.d)});
  const rows=Object.values(m).map(t=>({p:t.p,m1:t.m1,m2:t.m2,s1:t.s1,s2:t.s2,total:t.m1+t.m2+t.s1+t.s2,days:t.days.size}))
    .sort((x,y)=>SUBJ.indexOf(x.p.subj)-SUBJ.indexOf(y.p.subj)||x.p.name.localeCompare(y.p.name,'fr'));
  const tot=rows.reduce((a,r)=>({m1:a.m1+r.m1,m2:a.m2+r.m2,s1:a.s1+r.s1,s2:a.s2+r.s2,total:a.total+r.total,days:a.days+r.days}),{m1:0,m2:0,s1:0,s2:0,total:0,days:0});
  return{rows,tot}}

      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.3);
      o.connect(g);g.connect(sAC.destination);o.start(t0+d);o.stop(t0+d+.32)})
  }catch(e){}}

function pxTable(S){
  return `<div class="wrap"><table><tr><th>Nom complet</th><th>Matière</th><th>Présence</th><th>Créneaux absents</th><th>Jours d'absence</th><th>Justifiées</th><th>Alerte</th></tr>
  ${S.rows.map(o=>`<tr><td>${esc(o.p.name)}</td><td>${esc(o.p.subj)}</td><td>${o.t} %</td><td>${o.cr}</td><td>${o.jo}</td><td>${o.ju}</td><td class="${o.al?'er':''}">${o.al?'⚠️ À surveiller':'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="mu">Aucune donnée.</td></tr>'}</table></div>`}
function pxToday(list){
  const day=(db.pabs||{})[view.date]||{},ab=list.filter(p=>pxSlotNb(day[p.id]));
  return `<p style="margin:6px 0 10px"><b>Le ${frD(view.date)} :</b> ${ab.length?ab.length+' absent(s) — '+ab.map(p=>esc(p.name)+' ('+esc(profSlotTxt(day[p.id]))+')').join(', '):'<span class="ok">tout le monde est présent</span>'}</p>`}
function pxPanel(list,title,sj){
  const S=pxStats(list),P=S.P,n=list.length,cr=S.rows.reduce((a,o)=>a+o.cr,0),al=S.rows.filter(o=>o.al).length;
  return `<div class="card"><h2>${title}</h2>
  <div class="row">${perSel()}<span class="mu">Seuil d'alerte :</span><input type="number" min="1" value="${pxSeuil()}" style="width:80px" onchange="pxSetSeuil(this.value)"><span class="mu">créneaux</span></div>
  <p><b>Présence : ${taux(cr,n*P.n*4)} %</b> <span class="mu">· ${n} professeur(s) · ${cr} créneau(x) d'absence · ${P.n} jour(s) ouvré(s) · ${al} en alerte</span></p>
  ${pxToday(list)}
  ${pxTable(S)}
  <div class="row" style="margin-top:12px"><button class="s" onclick="pxExport('${sj}')">📤 Exporter en Excel</button></div>
  <p class="mu" style="font-size:12px">Présence = créneaux présents / créneaux possibles (4 par jour ouvré). Justifiée = absence avec un motif autre que « Sans motif ».</p></div>`}
function pxTools(l,sj){
  const w=new Date(view.date+'T12:00:00').getDay();
  return `<div class="card"><h2>⚡ Outils rapides · ${esc(sj)}</h2><div class="row">
  <button class="s" onclick="pxBulk('${sj}','')">✅ Tous présents</button>
  <button class="s" onclick="pxBulk('${sj}','m')">Absents matin 1 et 2</button>
  <button class="s" onclick="pxBulk('${sj}','s')">Absents soir 1 et 2</button>
  <button class="s" onclick="pxBulk('${sj}','ms')">Absents journée</button>
  <button class="s" onclick="pxCopyPrev('${sj}')">📋 Reprendre la veille</button></div>
  <p class="mu">Ces boutons s'appliquent aux ${l.length} professeur(s) de ${esc(sj)} pour le ${frD(view.date)}. Corrige ensuite individuellement dans le tableau.</p>${w===0||w===6?'<p class="er">Attention : ce jour est un week-end.</p>':''}</div>`}
function pxBulk(sj,k){if(!canProf())return;
  const l=(db.profs||[]).filter(p=>p.subj===sj);if(!l.length)return;
  const lab=k===''?'présents':k==='m'?'absents le matin (1 et 2)':k==='s'?'absents le soir (1 et 2)':'absents toute la journée';
  if(!confirm('Marquer les '+l.length+' professeur(s) de '+sj+' '+lab+' le '+frD(view.date)+' ?'+(k===''?'\nLes motifs et observations de ce jour seront effacés.':'')))return;
  keep(()=>{db.pabs=db.pabs||{};const d=db.pabs[view.date]=db.pabs[view.date]||{};
    l.forEach(p=>{
      if(!k){delete d[p.id];return}
      const r=d[p.id]=d[p.id]||{};
      if(k==='m'||k==='ms'){r.m1=true;r.m2=true}
      if(k==='s'||k==='ms'){r.s1=true;r.s2=true}});
    if(!Object.keys(d).length)delete db.pabs[view.date];
    save()})}
function pxCopyPrev(sj){if(!canProf())return;
  const cur=view.date||today(),d=new Date(cur+'T12:00:00');
  do{d.setDate(d.getDate()-1)}while(d.getDay()===0||d.getDay()===6);
  const prev=fmtD(d),src=(db.pabs||{})[prev]||{};
  const l=(db.profs||[]).filter(p=>p.subj===sj&&pxSlotNb(src[p.id]));
  if(!l.length)return alert('Aucune absence enregistrée le '+frD(prev)+' pour '+sj+'.');
  if(!confirm(l.length+' absence(s) du '+frD(prev)+' seront reprises pour le '+frD(cur)+' (créneaux seulement ; motifs et observations non repris). Continuer ?'))return;
  keep(()=>{db.pabs=db.pabs||{};const t=db.pabs[cur]=db.pabs[cur]||{};
    l.forEach(p=>{const s=src[p.id];t[p.id]={m1:!!s.m1,m2:!!s.m2,s1:!!s.s1,s2:!!s.s2}});
    save()})}
function pxExport(sj){
  if(!canProf())return;
  if(!window.XLSX)return alert('Module Excel non chargé. Vérifie ta connexion internet.');
  const P=pxPer(),S=pxStats((db.profs||[]).filter(p=>!sj||p.subj===sj));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Nom complet','Matière','Présence (%)','Créneaux absents',"Jours d'absence",'Jours justifiés','Alerte'],...S.rows.map(o=>[o.p.name,o.p.subj,o.t,o.cr,o.jo,o.ju,o.al?'Oui':'Non'])]),'Statistiques');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Date','Matière','Nom complet',"Type d'absence",'Motif','Observation'],...profAbsList(sj,P.a,P.b).map(o=>[o.d,o.p.subj,o.p.name,o.type,o.motif,o.obs])]),'Détail');
  XLSX.writeFile(wb,'presence_professeurs'+(sj?'_'+sj.replace(/\s+/g,'_'):'')+'_'+P.b+'.xlsx')}
function pxExtras(){
  if(!canProf()||view.tab!=='profs'||!$('sb'))return;
  const all=db.profs||[];
  if(!view.subj){if(all.length)$('sb').insertAdjacentHTML('beforeend',pxPanel(all,'📊 Tableau de bord des professeurs',''));return}
  const l=all.filter(p=>p.subj===view.subj);
  $('sb').insertAdjacentHTML('beforeend',pxTools(l,view.subj)+pxPanel(l,'📊 Statistiques · '+esc(view.subj),view.subj));
}

render();
</script>
</body>
</html>
