<script>
/* RETOUR sur chaque fenêtre ou boîte de dialogue ouverte : une étape en arrière à la fois, jusqu'à l'écran précédent */
(function(){
  var STATIC = { sov: true, devov: true };
  function visible(el){
    return !el.hidden && el.style.display !== 'none';
  }
  function candidates(){
    var out = [];
    var st = document.getElementById('sov'); if (st) out.push(st);
    var dv = document.getElementById('devov'); if (dv) out.push(dv);
    var va = document.getElementById('va-ov'); if (va) out.push(va);
    Array.prototype.forEach.call(document.body.children, function(el){
      if (el.id === 'exit-toast' || el.id === 'app' || el.tagName !== 'DIV') return;
      if (out.indexOf(el) !== -1) return;
      var s = el.getAttribute('style') || '';
      if (/position\s*:\s*fixed/.test(s)) out.push(el);
    });
    return out;
  }
  function close(el){
    if (el.id === 'sov' || el.id === 'devov') { el.hidden = true; return; }
    el.remove();
  }
  function panelOf(el){
    if (el.id === 'sov') return document.getElementById('sheet') || el;
    if (el.id === 'devov') return document.getElementById('devsh') || el;
    return el.firstElementChild || el;
  }
  function decorate(){
    candidates().forEach(function(el){
      if (!visible(el)) return;
      var panel = panelOf(el);
      if (!panel || panel.querySelector(':scope > .layer-retour')) return;
      var bar = document.createElement('div');
      bar.className = 'layer-retour';
      bar.style.cssText = 'display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid #D6E4F7;position:sticky;top:0;z-index:5';
      var b = document.createElement('button');
      b.className = 's';
      b.textContent = '← Retour';
      b.onclick = function(){ close(el); };
      bar.appendChild(b);
      panel.insertBefore(bar, panel.firstChild);
    });
  }
  setInterval(decorate, 400);
  decorate();
})();
</script>
<script>
/* Les AE : un compte « Les AE » sur l'accueil, avec un sous-compte par matière.
   Chaque AE garde sa liste de professeurs (saisie ou import Nom, Prénoms, Matière, Téléphone, Observation).
   MasterLog peut ajouter, renommer, fixer un code d'accès ou supprimer un AE. */
(function(){
  var DEF = [
    ['AE Français','Français'],['AE Anglais','Anglais'],['AE Hist-Géo','Hist-Géo'],['AE Philo','Philosophie'],
    ['AE Espagnol','Espagnol'],['AE Allemand','Allemand'],['AE Maths','Maths'],['AE PCT','PCT'],
    ['AE SVT','SVT'],['AE Économie','Économie'],['AE EPS','EPS'],['AE Informatique','Informatique'],
    ['AE Fongbé','Fongbé'],['AE Amideste','Amideste']
  ];
  var unlocked = {};
  function isMaster(){ return typeof me !== 'undefined' && !!me && me.role === 'master'; }
  function aes(){
    if (!db.aeAccts) {
      db.aeAccts = DEF.map(function(d, i){ return { id: 'ae' + (i + 1), name: d[0], mat: d[1], pass: '', profs: [] }; });
      try { save(); } catch (e) {}
    }
    return db.aeAccts;
  }
  /* Accès direct aux AE (sans code) : MasterLog, Directeur, Censeur, superviseur */
  function isStaffAE(){
    return !!me && (me.role === 'master' || me.role === 'sup' || me.id === 'de' || me.id === 'cens');
  }
  function aeOne(id){ return aes().find(function(x){ return x.id === id; }); }
  function commit(){ try { save(); } catch (e) {} try { render(); } catch (e) {} }

  /* ----- pages ----- */
  function renderAE(){
    var a = $('app'); if (!a) return;
    var t = view.target ? aeOne(view.target) : null;
    if (t) return renderOne(a, t);
    var rows = aes().map(function(x){
      var tools = isMaster()
        ? ' <span><button class="s" title="Renommer" onclick="event.stopPropagation();aeRen(\'' + x.id + '\')">✏️</button> ' +
          '<button class="s" title="Réinitialiser le code" onclick="event.stopPropagation();aeCode(\'' + x.id + '\')">🔑</button> ' +
          '<button class="d" title="Supprimer" onclick="event.stopPropagation();aeDel(\'' + x.id + '\')">🗑</button></span>'
        : '';
      return '<div class="cls" style="cursor:pointer" onclick="aeOpen(\'' + x.id + '\')"><b>' + esc(x.name) + '</b>' +
        '<span><span class="mu">' + (x.profs || []).length + ' professeur(s)</span>' + (x.pass ? ' 🔒' : '') + (isMaster() && x.pass ? ' <b>🔑 ' + esc(x.pass) + '</b>' : '') + tools + '</span></div>';
    }).join('');
    a.innerHTML = '<main><div class="row"><button class="s" onclick="aeBack()">← Retour</button></div>' +
      '<div class="card"><h2>📚 Les AE</h2><p class="mu">Choisis le compte AE de la matière pour gérer ses professeurs.</p>' +
      rows + (isMaster() ? '<div class="row" style="margin-top:12px"><button onclick="aeAdd()">+ Ajouter un AE</button></div>' : '') +
      '</div></main>';
  }
  function renderOne(a, t){
    var back = '<div class="row"><button class="s" onclick="go(\'ae\',{target:null})">← Les AE</button>' +
               (isMaster() ? '' : '') + '</div>';
    if (!isStaffAE() && !unlocked[t.id]) {
      var body = !t.pass
        ? '<p class="mu">Première connexion : crée ton code d\'accès (minimum 4 chiffres et/ou lettres).</p>' +
          '<input id="aeNc" type="password" placeholder="Ton code (minimum 4 caractères)" style="width:100%;margin-bottom:10px">' +
          '<input id="aeNc2" type="password" placeholder="Confirme ton code" style="width:100%;margin-bottom:10px">' +
          '<button style="width:100%" onclick="aeSetup(\'' + t.id + '\')">Créer mon code</button>'
        : '<input id="aePw" type="password" placeholder="Mot de passe" style="width:100%;margin-bottom:10px">' +
          '<button style="width:100%" onclick="aeUnlock(\'' + t.id + '\')">Se connecter</button>' +
          '<p class="mu" style="margin-top:8px">Code oublié ? Contacte MasterLog.</p>';
      a.innerHTML = '<main>' + back + '<div class="card" style="max-width:420px"><h2>🔒 ' + esc(t.name) + '</h2>' + body + '</div></main>';
      return;
    }
    var rows = (t.profs || []).map(function(p){
      return '<tr><td>' + esc(p.nom) + '</td><td>' + esc(p.prenoms) + '</td><td>' + esc(p.mat) + '</td><td>' + esc(p.tel) +
        '</td><td>' + esc(p.obs) + '</td><td><button class="d" onclick="aeDelProf(\'' + t.id + '\',\'' + p.id + '\')">✕</button></td></tr>';
    }).join('');
    a.innerHTML = '<main>' + back +
      '<div class="card"><h2>📚 ' + esc(t.name) + '</h2>' +
      (isMaster() ? '<div class="row" style="margin:4px 0 10px"><span>🔑 Code d\'accès : <b>' + esc(t.pass || 'pas encore créé') + '</b></span>' +
        (t.pass ? ' <button class="s" onclick="aeCode(\'' + t.id + '\')">Réinitialiser le code</button>' : '') + '</div>' : '') +
      '<div class="row"><button onclick="aeToggleForm()">' + (aeFormOpen ? '✖ Fermer' : '👤 Inscrire un professeur ou importer la liste') + '</button></div>' +
      (aeFormOpen ? '<div class="card" style="margin:10px 0">' +
      '<h3>Inscrire un professeur</h3>' +
      '<div class="row"><input id="aeN" placeholder="Nom" style="width:140px;height:38px;padding:4px 8px;font-size:16px"><input id="aeP" placeholder="Prénoms" style="width:140px;height:38px;padding:4px 8px;font-size:16px">' +
      '<input id="aeM" value="' + esc(t.mat) + '" placeholder="Matière" style="width:125px;height:38px;padding:4px 8px;font-size:16px"><input id="aeT" placeholder="Téléphone" style="width:125px;height:38px;padding:4px 8px;font-size:16px">' +
      '<input id="aeO" placeholder="Observation" style="width:150px;height:38px;padding:4px 8px;font-size:16px"></div>' +
      '<div class="row"><button onclick="aeAddProf(\'' + t.id + '\')">+ Ajouter</button></div>' +
      '<h3>Importer la liste des professeurs</h3>' +
      '<p class="mu">Fichier Excel, CSV ou Word avec l\'entête : Nom, Prénoms, Matière, Téléphone, Observation.</p>' +
      '<div class="row"><label class="btn s" style="border:1px solid var(--bd);color:var(--pr);background:none">📥 Importer Excel / Word<input type="file" hidden accept=".xlsx,.xls,.csv,.docx" onchange="aeImport(\'' + t.id + '\',this.files[0])"></label>' +
      '<button class="s" onclick="aeTpl()">📄 Modèle Excel</button> <button class="s" onclick="aeTplWord()">📄 Modèle Word</button></div></div>' : '') +
      '<h3>Liste des professeurs (' + (t.profs || []).length + ')</h3>' +
      '<div class="wrap"><table><tr><th>Nom</th><th>Prénoms</th><th>Matière</th><th>Téléphone</th><th>Observation</th><th></th></tr>' +
      (rows || '<tr><td colspan="6" class="mu">Aucun professeur pour le moment.</td></tr>') + '</table></div>' + aeSearchHtml(t) + presenceHtml(t) + vuHtml(t) + rapHtml(t) +
      '</div></main>';
  }

  /* ----- présence des professeurs ----- */
  function todayIso(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  /* Normalisation pour la recherche et les doublons : sans accents, sans majuscules */
  function aeNorm(t){
    return String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  }
  var aeFormOpen = false;
  var aeState = { date: todayIso(), mode: 'jour', from: todayIso(), to: todayIso() };
  function frDate(d){ return String(d || '').split('-').reverse().join('/'); }
  function countAtt(p, from, to){
    var c = { P: 0, A: 0 }, att = p.att || {};
    Object.keys(att).forEach(function(k){ if (k >= from && k <= to) c[att[k]] = (c[att[k]] || 0) + 1; });
    return c;
  }
  /* Liste des présents (P) ou absents (A) selon le mode choisi */
  function listItems(t, kind){
    var out = [];
    (t.profs || []).forEach(function(p){
      if (aeState.mode === 'jour') {
        if ((p.att || {})[aeState.date] === kind) out.push({ p: p, n: 0 });
      } else {
        var c = countAtt(p, aeState.from, aeState.to);
        if (c[kind]) out.push({ p: p, n: c[kind] });
      }
    });
    return out;
  }
  function listHtml(title, kind, t){
    var items = listItems(t, kind), per = aeState.mode === 'periode';
    var trs = items.map(function(x){
      return '<tr><td>' + esc(x.p.nom) + '</td><td>' + esc(x.p.prenoms) + '</td><td>' + esc(x.p.mat) + '</td><td>' + esc(x.p.tel) + '</td>' +
             '<td>' + (per ? x.n + ' jour(s)' : esc(x.p.obs)) + '</td></tr>';
    }).join('');
    return '<h3>' + title + ' (' + items.length + ')</h3>' +
      '<div class="row"><button class="' + (kind === 'P' ? 'ar' : 'd') + '" onclick="aePdf(\'' + t.id + '\',\'' + kind + '\')">📄 PDF ' +
      (kind === 'P' ? 'liste des présents' : 'liste des absents') + '</button> ' +
      '<button class="s" onclick="aeWord(\'' + t.id + '\',\'' + kind + '\')">📝 Word ' + (kind === 'P' ? 'liste des présents' : 'liste des absents') + '</button></div>' +
      '<div class="wrap"><table><tr><th>Nom</th><th>Prénoms</th><th>Matière</th><th>Téléphone</th><th>' + (per ? 'Jours' : 'Observation') + '</th></tr>' +
      (trs || '<tr><td colspan="5" class="mu">Aucun.</td></tr>') + '</table></div>';
  }
  /* Recherche d'un professeur dans l'AE : nom affiché + boutons Présent / Absent */
  var aeQuery = '';
  function resultsHtml(t, q){
    q = (q || '').trim();
    if (!q) return '';
    var key = aeNorm(q);
    var list = (t.profs || []).filter(function(p){ return aeNorm((p.nom || '') + ' ' + (p.prenoms || '')).indexOf(key) >= 0; });
    if (!list.length) return '<p class="mu">Aucun professeur trouvé.</p>';
    var jour = aeState.mode === 'jour';
    return list.map(function(p){
      var st = (p.att || {})[aeState.date];
      var btns = jour
        ? '<button class="' + (st === 'P' ? 'ar' : 's') + '" onclick="aeMark(\'' + t.id + '\',\'' + p.id + '\',\'P\')">✔ Présent</button> ' +
          '<button class="' + (st === 'A' ? 'd' : 's') + '" onclick="aeMark(\'' + t.id + '\',\'' + p.id + '\',\'A\')">✖ Absent</button>'
        : '<span class="mu">Passe en mode Jour pour marquer la présence</span>';
      return '<div class="cls" style="flex-wrap:wrap;gap:8px"><b>' + esc(p.nom) + ' ' + esc(p.prenoms) + '</b>' +
             '<span class="mu">' + esc(p.mat) + '</span><span>' + btns + '</span></div>';
    }).join('');
  }
  function aeSearchHtml(t){
    return '<h3>Rechercher un professeur</h3>' +
      '<input id="aeQ" placeholder="Tape le nom du professeur" value="' + esc(aeQuery) + '" ' +
      'oninput="aeSearch(this.value,\'' + t.id + '\')" style="width:100%;height:40px;font-size:16px;padding:4px 8px;margin-bottom:8px">' +
      '<div id="aeRes">' + resultsHtml(t, aeQuery) + '</div>';
  }
  window.aeSearch = function(v, id){
    aeQuery = v || '';
    var t = aeOne(id), box = document.getElementById('aeRes');
    if (t && box) box.innerHTML = resultsHtml(t, aeQuery);
  };
  var aeVuOpen = '';
  window.aeToggleVu = function(kind){ aeVuOpen = aeVuOpen === kind ? '' : kind; render(); };
  function histOf(t, kind){
    return (t.absLog || []).filter(function(e){ return (e.k || 'A') === kind; }).sort(function(a, b){ return b.ts - a.ts; });
  }
  function histByMonth(list){
    var m = {};
    list.forEach(function(e){ var k = e.date.slice(0, 7); (m[k] = m[k] || []).push(e); });
    return m;
  }
  function vuHtml(t){
    var bA = '<button onclick="aeToggleVu(\'A\')">' + (aeVuOpen === 'A' ? '✖ Fermer Vu Absents' : '👁 Vu Absents') + '</button>';
    var bP = '<button onclick="aeToggleVu(\'P\')">' + (aeVuOpen === 'P' ? '✖ Fermer Vu Présents' : '👁 Vu Présents') + '</button>';
    var head = '<div class="row" style="margin-top:12px">' + bA + ' ' + bP + '</div>';
    if (!aeVuOpen) return head;
    var kind = aeVuOpen, isA = kind === 'A';
    var months = histByMonth(histOf(t, kind));
    var keys = Object.keys(months).sort().reverse();
    var body = keys.length ? keys.map(function(k){
      var rows = months[k].map(function(e){
        return '<tr><td>' + frDate(e.date) + '</td><td>' + esc(e.nom) + ' ' + esc(e.prenoms) + '</td><td>' + esc(e.mat) + '</td>' +
               '<td>' + (e.act === 'cochée' ? (isA ? '✖ Absence cochée' : '✔ Présence cochée') : (isA ? '↺ Absence décochée' : '↺ Présence décochée')) + '</td>' +
               '<td>' + frDate(e.at.slice(0, 10)) + ' à ' + e.at.slice(11, 16) + '</td></tr>';
      }).join('');
      return '<h3>' + monthLabel(k) + '</h3><div class="wrap"><table><tr><th>Date de séance</th><th>Professeur</th><th>Matière</th><th>Action</th><th>Enregistré le</th></tr>' + rows + '</table></div>';
    }).join('') : '<p class="mu">Aucun historique pour le moment.</p>';
    return head + '<div class="card" style="margin-top:10px"><h2>' + (isA ? '👁 Vu Absents' : '👁 Vu Présents') + ' · ' + esc(t.name) + '</h2>' +
      '<p class="mu">' + (isA ? 'Absences cochées et décochées' : 'Présences cochées et décochées') + ' : historique enregistré automatiquement, non modifiable, classé par mois.</p>' +
      '<div class="row"><button class="ar" onclick="aeHistPdf(\'' + t.id + '\',\'' + kind + '\')">📄 Télécharger en PDF</button></div>' +
      body + '</div>';
  }
  window.aeHistPdf = function(aid, kind){
    var t = aeOne(aid); if (!t) return;
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) return alert('Bibliothèque PDF non chargée. Vérifie ta connexion internet.');
    var isA = kind === 'A';
    var months = histByMonth(histOf(t, kind));
    var keys = Object.keys(months).sort().reverse();
    var doc = new J({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    doc.setFont(undefined, 'bold'); doc.setFontSize(14);
    doc.text((isA ? 'Vu Absents' : 'Vu Présents') + ' · ' + t.name, 14, 16);
    doc.setFont(undefined, 'normal'); doc.setFontSize(9);
    doc.text('Historique non modifiable, classé par mois · édité le ' + frDate(todayIso()), 14, 22);
    var y = 28;
    if (!keys.length) doc.text('Aucun historique pour le moment.', 14, y);
    keys.forEach(function(k){
      if (y > 175) { doc.addPage(); y = 16; }
      doc.setFont(undefined, 'bold'); doc.setFontSize(11); doc.text(monthLabel(k), 14, y);
      var rows = months[k].map(function(e){
        return [frDate(e.date), (e.nom || '') + ' ' + (e.prenoms || ''), e.mat || '',
                e.act === 'cochée' ? (isA ? 'Absence cochée' : 'Présence cochée') : (isA ? 'Absence décochée' : 'Présence décochée'),
                frDate(e.at.slice(0, 10)) + ' à ' + e.at.slice(11, 16)];
      });
      doc.autoTable({
        startY: y + 3, margin: { left: 14, right: 14 },
        head: [['Date de séance', 'Professeur', 'Matière', 'Action', 'Enregistré le']], body: rows,
        headStyles: { fillColor: [29, 95, 191] }, styles: { fontSize: 8 }
      });
      y = doc.lastAutoTable.finalY + 10;
    });
    doc.save((isA ? 'vu_absents_' : 'vu_presents_') + t.name.replace(/[^A-Za-z0-9]+/g, '_') + '.pdf');
  };
  /* ----- Rapport de séance (thème, 6 sous-titres développés, divers ; 100 mots max par bande) ----- */
  var aeRapOpen = false;
  var aeRapDate = todayIso();
  var RAP_FIELDS = [['theme', 'Thème de la séance']].concat([1, 2, 3, 4, 5, 6].map(function(i){ return ['st' + i, 'Sous-titre développé ' + i]; }))
    .concat([['divers', 'Divers']]);
  var RAP_MAX = 100;
  function wordCount(text){ return (String(text || '').trim().match(/\S+/g) || []).length; }
  function truncWords(text, n){
    text = String(text || '');
    var re = /\S+/g, m, c = 0, end = 0;
    while ((m = re.exec(text))) {
      c++; end = m.index + m[0].length;
      if (c === n) return re.exec(text) ? text.slice(0, end) : text;
    }
    return text;
  }
  function rapOf(t, date){
    t.rapports = t.rapports || {};
    t.rapports[date] = t.rapports[date] || {};
    return t.rapports[date];
  }
  window.aeRapToggle = function(){ aeRapOpen = !aeRapOpen; render(); };
  window.aeRapSetDate = function(v){ aeRapDate = v || todayIso(); render(); };
  window.aeRapSet = function(aid, k, el){
    var t = aeOne(aid); if (!t) return;
    var v = truncWords(el.value, RAP_MAX);
    if (v !== el.value) el.value = v;
    rapOf(t, aeRapDate)[k] = v;
    var c = document.getElementById('rc_' + k);
    if (c) c.textContent = wordCount(v) + ' / ' + RAP_MAX + ' mots';
    try { save(); } catch (e) {}
  };
  function rapHtml(t){
    var btn = '<div class="row" style="margin-top:12px"><button onclick="aeRapToggle()">' + (aeRapOpen ? '✖ Fermer le rapport' : '📋 RAPPORT SÉANCE') + '</button></div>';
    if (!aeRapOpen) return btn;
    var r = (t.rapports || {})[aeRapDate] || {};
    var fields = RAP_FIELDS.map(function(f){
      var v = r[f[0]] || '';
      return '<div style="margin-top:10px"><label><b>' + esc(f[1]) + '</b> <span id="rc_' + f[0] + '" class="mu">' + wordCount(v) + ' / ' + RAP_MAX + ' mots</span></label>' +
        '<textarea rows="3" style="width:100%;font-size:15px;padding:6px 8px;box-sizing:border-box" oninput="aeRapSet(\'' + t.id + '\',\'' + f[0] + '\',this)">' + esc(v) + '</textarea></div>';
    }).join('');
    return btn + '<div class="card" style="margin-top:10px"><h2>📋 Rapport de séance · ' + esc(t.name) + '</h2>' +
      '<div class="row"><label>Date de la séance</label> <input type="date" value="' + aeRapDate + '" onchange="aeRapSetDate(this.value)"></div>' +
      fields + nomAeHtml(t) +
      '<div class="row" style="margin-top:12px"><button class="ar" onclick="aeRapPdf(\'' + t.id + '\')">📄 PDF du rapport</button></div></div>';
  }
  window.aeRapPdf = function(aid){
    var t = aeOne(aid); if (!t) return;
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) return alert('Bibliothèque PDF non chargée. Vérifie ta connexion internet.');
    var r = (t.rapports || {})[aeRapDate] || {};
    var doc = new J({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var y = 20;
    doc.setFont(undefined, 'bold'); doc.setFontSize(15); doc.text('Rapport de séance d\'animation pédagogique', 15, y);
    y += 7; doc.setFont(undefined, 'normal'); doc.setFontSize(10);
    doc.text('Séance du ' + frDate(aeRapDate), 15, y);
    y += 10;
    RAP_FIELDS.forEach(function(f){
      var lines = doc.splitTextToSize(r[f[0]] || '—', 180);
      if (y + 8 + lines.length * 5 > 280) { doc.addPage(); y = 20; }
      doc.setFont(undefined, 'bold'); doc.setFontSize(11); doc.text(f[1], 15, y);
      y += 6; doc.setFont(undefined, 'normal'); doc.setFontSize(10);
      doc.text(lines, 15, y);
      y += lines.length * 5 + 6;
    });
    /* Nom complet de l'AE, après un espace de deux lignes */
    y += 12;
    if (y > 280) { doc.addPage(); y = 20; }
    doc.setFont(undefined, 'bold'); doc.setFontSize(12); doc.text(t.name, 15, y);
    doc.save('rapport_seance_' + t.name.replace(/[^A-Za-z0-9]+/g, '_') + '_' + aeRapDate + '.pdf');
  };
  /* Bande « Nom complet de l'AE » : verrouillée ; le cadenas doit être débloqué avant de changer le nom */
  var aeNameOpen = {};
  function nomAeHtml(t){
    var open = !!aeNameOpen[t.id];
    return '<div style="margin-top:14px"><label><b>Nom complet de l\'AE</b></label>' +
      '<div class="row"><input id="aeNm" value="' + esc(t.name) + '"' + (open ? '' : ' disabled') +
      ' style="flex:1 1 220px;height:38px;font-size:16px;padding:4px 8px">' +
      '<button class="s" title="' + (open ? 'Reverrouiller' : 'Déverrouiller pour modifier') + '" onclick="aeNameLock(\'' + t.id + '\')">' + (open ? '🔓' : '🔒') + '</button>' +
      (open ? ' <button class="ar" onclick="aeNameSave(\'' + t.id + '\')">💾 Enregistrer le nom</button>' : '') +
      '</div></div>';
  }
  window.aeNameLock = function(aid){ aeNameOpen[aid] = !aeNameOpen[aid]; render(); };
  window.aeNameSave = function(aid){
    var t = aeOne(aid); if (!t) return;
    var v = (($('aeNm') || {}).value || '').trim().replace(/\s+/g, ' ');
    if (!v) return alert('Le nom ne peut pas être vide.');
    t.name = v; aeNameOpen[aid] = false; commit();
  };
  function presenceHtml(t){
    var S = aeState, d = S.date;
    var modes = '<button class="' + (S.mode === 'jour' ? 'on' : 's') + '" onclick="aeMode(\'jour\')">Jour</button> ' +
                '<button class="' + (S.mode === 'periode' ? 'on' : 's') + '" onclick="aeMode(\'periode\')">Période</button>';
    var when = S.mode === 'jour'
      ? '<input type="date" value="' + S.date + '" onchange="aeDate(this.value)">'
      : 'Du <input type="date" value="' + S.from + '" onchange="aeRange(\'from\',this.value)"> au <input type="date" value="' + S.to + '" onchange="aeRange(\'to\',this.value)">';
    var html = '<h3>Présence des professeurs</h3><div class="row">' + modes + ' ' + when + '</div>';
    if (S.mode === 'jour') {
      var trs = (t.profs || []).map(function(p){
        var st = (p.att || {})[d];
        return '<tr><td>' + esc(p.nom) + '</td><td>' + esc(p.prenoms) + '</td><td>' + esc(p.mat) + '</td><td>' +
          '<button class="' + (st === 'P' ? 'ar' : 's') + '" onclick="aeMark(\'' + t.id + '\',\'' + p.id + '\',\'P\')">✔ Présent</button> ' +
          '<button class="' + (st === 'A' ? 'd' : 's') + '" onclick="aeMark(\'' + t.id + '\',\'' + p.id + '\',\'A\')">✖ Absent</button></td></tr>';
      }).join('');
      html += '<div class="wrap"><table><tr><th>Nom</th><th>Prénoms</th><th>Matière</th><th>Présence le ' + frDate(d) + '</th></tr>' +
        (trs || '<tr><td colspan="4" class="mu">Aucun professeur.</td></tr>') + '</table></div>';
    } else {
      html += '<p class="mu">En mode Période, les listes ci-dessous se calculent sur les dates choisies. Pour cocher la présence, passe en mode Jour.</p>';
    }
    return html + listHtml('Liste des présents', 'P', t) + listHtml('Liste des absents', 'A', t);
  }
  var MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  function monthLabel(k){ var a = k.split('-'); return MOIS[parseInt(a[1], 10) - 1] + ' ' + a[0]; }
  function nowStamp(){
    var d = new Date(), p2 = function(n){ return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  }
  window.aeMark = function(aid, pid, st){
    var t = aeOne(aid); if (!t) return;
    var p = (t.profs || []).find(function(x){ return x.id === pid; }); if (!p) return;
    p.att = p.att || {};
    var prev = p.att[aeState.date], next;
    if (prev === st) { delete p.att[aeState.date]; next = null; }
    else { p.att[aeState.date] = st; next = st; }
    /* Historique (ajout seulement, non modifiable) : Absent (A) et Présent (P) */
    if (prev !== next) {
      t.absLog = t.absLog || [];
      var stamp = nowStamp(), by = (typeof me !== 'undefined' && me && me.name) ? me.name : '';
      var entry = function(k, act){
        t.absLog.push({ ts: Date.now(), at: stamp, date: aeState.date, k: k, nom: p.nom || '', prenoms: p.prenoms || '',
                        mat: p.mat || '', act: act, by: by });
      };
      if (prev) entry(prev, 'décochée');
      if (next) entry(next, 'cochée');
    }
    commit();
  };
  window.aeDate = function(v){ aeState.date = v || todayIso(); render(); };
  window.aeRange = function(k, v){ aeState[k] = v || todayIso(); render(); };
  window.aeMode = function(m){ aeState.mode = m; render(); };
  /* Téléchargement Word (.doc ouvrable dans Word) : même contenu que le PDF */
  window.aeWord = function(aid, kind){
    var t = aeOne(aid); if (!t) return;
    var items = listItems(t, kind), per = aeState.mode === 'periode';
    var title = kind === 'P' ? 'Liste des professeurs présents' : 'Liste des professeurs absents';
    var when = per ? 'Du ' + frDate(aeState.from) + ' au ' + frDate(aeState.to) : 'Le ' + frDate(aeState.date);
    var esc2 = function(x){ return esc(x); };
    var rows = '<tr><th>Nom</th><th>Prénoms</th><th>Matière</th><th>Téléphone</th><th>' + (per ? 'Nombre de jours' : 'Observation') + '</th></tr>' +
      items.map(function(x){
        return '<tr><td>' + esc2(x.p.nom) + '</td><td>' + esc2(x.p.prenoms) + '</td><td>' + esc2(x.p.mat) + '</td><td>' + esc2(x.p.tel) + '</td><td>' +
               (per ? x.n + ' jour(s)' : esc2(x.p.obs)) + '</td></tr>';
      }).join('');
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>' +
      '<h2>' + esc(title) + '</h2><p>' + esc(t.name) + ' · ' + esc(when) + '</p>' +
      '<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%">' + rows + '</table></body></html>';
    var blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (kind === 'P' ? 'presents' : 'absents') + '_' + t.name.replace(/[^A-Za-z0-9]+/g, '_') + '_' + (per ? aeState.from + '_' + aeState.to : aeState.date) + '.doc';
    document.body.appendChild(a); a.click(); a.remove();
  };
  window.aePdf = function(aid, kind){
    var t = aeOne(aid); if (!t) return;
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) return alert('Bibliothèque PDF non chargée. Vérifie ta connexion internet.');
    var items = listItems(t, kind), per = aeState.mode === 'periode';
    var doc = new J({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    var title = kind === 'P' ? 'Liste des professeurs présents' : 'Liste des professeurs absents';
    var when = per ? 'Du ' + frDate(aeState.from) + ' au ' + frDate(aeState.to) : 'Le ' + frDate(aeState.date);
    doc.setFont(undefined, 'bold'); doc.setFontSize(14); doc.text(title, 14, 16);
    doc.setFont(undefined, 'normal'); doc.setFontSize(10); doc.text(t.name + ' · ' + when, 14, 23);
    var body = items.map(function(x){
      return [x.p.nom || '', x.p.prenoms || '', x.p.mat || '', x.p.tel || '', per ? String(x.n) + ' jour(s)' : (x.p.obs || '')];
    });
    doc.autoTable({
      startY: 28, head: [['Nom', 'Prénoms', 'Matière', 'Téléphone', per ? 'Nombre de jours' : 'Observation']], body: body,
      headStyles: { fillColor: [29, 95, 191] }, styles: { fontSize: 9 }
    });
    var name = (kind === 'P' ? 'presents' : 'absents') + '_' + t.name.replace(/[^A-Za-z0-9]+/g, '_') + '_' + (per ? aeState.from + '_' + aeState.to : aeState.date) + '.pdf';
    doc.save(name);
  };

  /* ----- actions ----- */
  window.aeToggleForm = function(){ aeFormOpen = !aeFormOpen; render(); };
  window.aeOpen = function(id){ go('ae', { target: id }); };
  window.aeBack = function(){
    if (typeof me !== 'undefined' && me) { view.page = 'app'; view.target = null; render(); }
    else go('home');
  };
  window.aeUnlock = function(id){
    var t = aeOne(id); if (!t) return;
    var c = ($('aePw') || {}).value || '';
    if (!t.pass || c !== t.pass) return alert('Mot de passe incorrect.');
    unlocked[id] = 1; render();
  };
  window.aeSetup = function(id){
    var t = aeOne(id); if (!t) return;
    var c1 = ($('aeNc') || {}).value || '', c2 = ($('aeNc2') || {}).value || '';
    if (c1.trim().length < 4) return alert('Le code doit contenir au moins 4 caractères.');
    if (c1 !== c2) return alert('Les deux codes ne sont pas identiques.');
    t.pass = c1; unlocked[id] = 1; commit();
  };
  window.aeAddProf = function(id){
    var t = aeOne(id); if (!t) return;
    var nom = ($('aeN').value || '').trim().replace(/\s+/g, ' ');
    if (!nom) return alert('Le nom est obligatoire.');
    t.profs = t.profs || [];
    t.profs.push({ id: uid(), nom: nom, prenoms: ($('aeP').value || '').trim(), mat: ($('aeM').value || '').trim() || t.mat,
                   tel: ($('aeT').value || '').trim(), obs: ($('aeO').value || '').trim() });
    commit();
  };
  window.aeDelProf = function(aid, pid){
    var t = aeOne(aid); if (!t || !confirm('Retirer ce professeur de la liste ?')) return;
    t.profs = (t.profs || []).filter(function(p){ return p.id !== pid; });
    commit();
  };
  function normKey(s){
    var k = aeNorm(String(s || '')).replace(/[^a-z]/g, '');
    if (k.indexOf('nom') === 0 && k.indexOf('prenom') < 0) return 'nom';
    if (k.indexOf('prenom') === 0) return 'prenoms';
    if (k.indexOf('mati') === 0) return 'mat';
    if (k.indexOf('tel') === 0 || k.indexOf('phone') === 0) return 'tel';
    if (k.indexOf('observ') === 0) return 'obs';
    return '';
  }
  function readBuf(f){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(r.result); };
      r.onerror = function(){ reject(new Error('lecture du fichier impossible')); };
      r.readAsArrayBuffer(f);
    });
  }
  window.aeImport = async function(id, f){
    var t = aeOne(id); if (!t || !f) return;
    var rows = [], name = (f.name || '').toLowerCase();
    try {
      var buf = await readBuf(f);
      if (/\.docx$/.test(name)) {
        if (!window.mammoth) throw new Error('module Word non chargé (vérifie ta connexion internet)');
        var h = (await mammoth.convertToHtml({ arrayBuffer: buf })).value;
        var d = new DOMParser().parseFromString(h, 'text/html');
        d.querySelectorAll('tr').forEach(function(tr){
          rows.push(Array.from(tr.children).map(function(td){ return td.textContent.trim(); }));
        });
        if (!rows.length) {
          /* Word sans tableau : une ligne par professeur, champs séparés par tabulation, point-virgule ou virgule */
          d.querySelectorAll('p').forEach(function(p){
            var line = p.textContent.trim(); if (!line) return;
            rows.push(line.split(/\t|;|,/).map(function(x){ return x.trim(); }));
          });
        }
      } else {
        if (!window.XLSX) throw new Error('module Excel non chargé (vérifie ta connexion internet)');
        var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      }
    } catch (e) { return alert('Import impossible : ' + e.message); }
    rows = rows.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
    var map = ['nom', 'prenoms', 'mat', 'tel', 'obs'];
    if (rows.length) {
      var hdr = rows[0].map(normKey);
      if (hdr.indexOf('nom') >= 0) { map = hdr; rows.shift(); }
    }
    t.profs = t.profs || [];
    var add = 0, skip = 0, bad = 0;
    rows.forEach(function(r){
      var o = {};
      map.forEach(function(k, i){ if (k) o[k] = String(r[i] === undefined ? '' : r[i]).trim().replace(/\s+/g, ' '); });
      if (!o.nom) { bad++; return; }
      var key = aeNorm(o.nom + '|' + (o.prenoms || '') + '|' + (o.mat || ''));
      if (t.profs.some(function(p){ return aeNorm(p.nom + '|' + (p.prenoms || '') + '|' + (p.mat || '')) === key; })) { skip++; return; }
      t.profs.push({ id: uid(), nom: o.nom, prenoms: o.prenoms || '', mat: o.mat || t.mat, tel: o.tel || '', obs: o.obs || '' });
      add++;
    });
    commit();
    alert(add + ' professeur(s) importé(s) · ' + skip + ' doublon(s) · ' + bad + ' ligne(s) ignorée(s).');
  };
  window.aeTpl = function(){
    if (!window.XLSX) return alert('Module Excel non chargé. Vérifie ta connexion internet.');
    var ws = XLSX.utils.aoa_to_sheet([['Nom', 'Prénoms', 'Matière', 'Téléphone', 'Observation'], ['Awa', 'Diallo', 'Français', '0190000000', '']]);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Professeurs');
    XLSX.writeFile(wb, 'modele-import-professeurs-AE.xlsx');
  };
  window.aeTplWord = function(){
    var rows = '<tr><td>Nom</td><td>Prénoms</td><td>Matière</td><td>Téléphone</td><td>Observation</td></tr>' +
               '<tr><td>Awa</td><td>Diallo</td><td>Français</td><td>0190000000</td><td></td></tr>';
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>' +
               '<table border="1" cellspacing="0" cellpadding="4">' + rows + '</table></body></html>';
    var blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'modele-import-professeurs-AE.doc';
    document.body.appendChild(a); a.click(); a.remove();
  };
  window.aeAdd = function(){
    if (!isMaster()) return;
    var n = (prompt('Nom du nouvel AE (ex : AE Latin) :') || '').trim();
    if (!n) return;
    aes().push({ id: 'ae' + uid(), name: n, mat: n.replace(/^AE\s*/i, ''), pass: '', profs: [] });
    commit();
  };
  window.aeRen = function(id){
    if (!isMaster()) return;
    var t = aeOne(id); if (!t) return;
    var n = (prompt('Nouveau nom :', t.name) || '').trim();
    if (!n) return;
    t.name = n; commit();
  };
  window.aeCode = function(id){
    if (!isMaster()) return;
    var t = aeOne(id); if (!t) return;
    if (!confirm('Réinitialiser le code de « ' + t.name + ' » ? Le compte devra en créer un nouveau à sa prochaine connexion.')) return;
    t.pass = ''; delete unlocked[id]; commit();
  };
  window.aeDel = function(id){
    if (!isMaster()) return;
    var t = aeOne(id); if (!t || !confirm('Supprimer « ' + t.name + ' » et ses professeurs ?')) return;
    db.aeAccts = aes().filter(function(x){ return x.id !== id; });
    commit();
  };

  /* ----- Les AE dans « Gestion des Professeurs » (visible pour les SG, le Directeur, le Censeur, le superviseur et le MasterLog) ----- */
  var prevProfsPage = window.profsPage;
  window.profsPage = function(){
    var r = prevProfsPage.apply(this, arguments);
    try {
      var sb = $('sb');
      var okProf = !!me && (me.role === 'master' || me.role === 'sup' || me.id === 'de' || me.id === 'cens');
      if (sb && !view.subj && okProf) {
        sb.insertAdjacentHTML('beforeend',
          '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">📚 Les AE : professeurs par matière</h3>' +
          aes().map(function(x){
            return '<div class="cls" style="cursor:pointer" onclick="aeOpen(\'' + x.id + '\')"><b>' + esc(x.name) + '</b>' +
                   '<span class="mu">' + (x.profs || []).length + ' professeur(s)' + (x.pass ? ' 🔒' : '') + ' ›</span></div>';
          }).join('') + '</div>');
      }
    } catch (e) {}
    return r;
  };
  /* SG : Gestion des Professeurs visible (listes, présences), mais aucun téléchargement */
  function hideDownloadsForSG(){
    if (!(typeof me !== 'undefined' && me && me.role === 'surv')) return;
    var root = $('m'); if (!root) return;
    root.querySelectorAll('button, label, a').forEach(function(el){
      if (/PDF|Word|Excel|Télécharg|Modèle|Export|Imprimer|Importer/i.test(el.textContent)) el.style.display = 'none';
    });
  }
  var prevProfsPage2 = window.profsPage;
  window.profsPage = function(){ var r = prevProfsPage2.apply(this, arguments); try { hideDownloadsForSG(); } catch (e) {} return r; };
  var prevProfSearch = window.profSearch;
  window.profSearch = function(){ var r = prevProfSearch.apply(this, arguments); try { hideDownloadsForSG(); } catch (e) {} return r; };
  /* ----- boutons d'accès ----- */
  function addHomeBtn(){
    var nav = document.querySelector('#home .hside nav');
    if (!nav || nav.querySelector('#bae')) return;
    var b = document.createElement('button');
    b.id = 'bae'; b.className = 'hb'; b.textContent = '📚 Les AE';
    b.onclick = function(){ go('ae'); };
    var alt = nav.querySelector('button.hb.alt');
    nav.insertBefore(b, alt || null);
  }
  function addHeaderBtn(){
    var lo = Array.from(document.querySelectorAll('header button')).find(function(x){ return x.getAttribute('onclick') === 'logout()'; });
    if (!lo || lo.parentNode.querySelector('#baeh')) return;
    var b = document.createElement('button');
    b.id = 'baeh'; b.className = 's'; b.textContent = '📚 Les AE';
    b.onclick = function(){ go('ae'); };
    lo.parentNode.insertBefore(b, lo);
  }

  /* Accueil : espaces réduits entre les comptes pour voir aussi la recherche */
  (function(){
    var st = document.createElement('style');
    st.textContent =
      '#home .hside nav{gap:10px!important;padding:4px 8px!important}' +
      '#home .hside nav button.hb{padding:6px 12px!important;min-height:0!important;line-height:1.2!important}' +
      '#home .hside nav button.hb i{flex:0 0 32px!important;width:32px!important;height:32px!important;font-size:24px!important}' +
      '#home .hside .mlw{margin:max(24px,calc(100dvh - 210px)) 8px 0!important;padding-top:6px!important}';
    document.head.appendChild(st);
  })();
  var prevRender = window.render;
  window.render = function(){
    if (view.page === 'ae') { renderAE(); return; }
    var r = prevRender.apply(this, arguments);
    try {
      if (!(typeof me !== 'undefined' && me)) addHomeBtn();
      else if (isMaster()) addHeaderBtn();
      /* DIRECT dans l'espace d'un SG pour MasterLog, Directeur, Censeur et superviseur (la règle du bouton existe déjà dans l'application) */
      if (me && me.role !== 'surv' && view.page === 'app' && !view.direct && view.tab === 'sga' && view.sg && !document.getElementById('dbtn') && typeof addDirect === 'function') addDirect();
    } catch (e) {}
    return r;
  };
  try { render(); } catch (e) {}
})();
</script>
</body>
